  --red: #ff5a78;
  --orange: #ff9f40;
  --yellow: #ffd93d;
  --green: #2fbf71;
  --blue: #4b9dff;
  --purple: #9b6bff;
  --pink: #ff7eb6;
  --teal: #25b9d1;
  --px: 4px;
  --head: 'Press Start 2P', ui-monospace, monospace;
  --body: 'PFG Digits', 'Pixelify Sans', ui-rounded, system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(var(--dot) 2px, transparent 2.5px),
    linear-gradient(180deg, #ffe8f2 0, rgba(255, 232, 242, 0) 220px);
  background-size: 20px 20px, 100% 100%;
  color: var(--ink);
  font: 18px/1.35 var(--body);
  overscroll-behavior-y: none;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; -webkit-user-drag: none; }
b { font-weight: 700; }
.center { text-align: center; }
.tiny { display: block; font-size: 14px; color: var(--ink-soft); line-height: 1.3; }
.sub { color: var(--ink-soft); margin: 4px 0 12px; font-size: 17px; }

#app { max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.screen {
  flex: 1; display: flex; flex-direction: column;
  padding: calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
  animation: screenIn .22s steps(4) both;
}
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Pixel boxes & buttons ---------- */
.box {
  background: var(--paper);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--ink),
    0 var(--px) 0 0 var(--ink),
    calc(var(--px) * -1) 0 0 0 var(--ink),
    var(--px) 0 0 0 var(--ink),
    0 calc(var(--px) * 2) 0 0 rgba(43, 33, 64, .18);
  margin: var(--px);
}
.btn {
  --t: var(--ink);
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font: 12px/1.4 var(--head);
  text-transform: uppercase;
  color: var(--t);
  background: var(--c, var(--yellow));
  padding: 16px 14px 14px;
  margin: 4px 4px 12px;
  min-height: 54px;
  box-shadow:
    0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink),
    0 8px 0 0 var(--ink),
    inset 0 -4px 0 0 rgba(0, 0, 0, .16), inset 4px 4px 0 0 rgba(255, 255, 255, .45);
  transition: transform .05s;
}
.btn:active:not(:disabled) {
  transform: translateY(4px);
  box-shadow:
    0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink),
    inset 0 4px 0 0 rgba(0, 0, 0, .16);
}
.btn:disabled { filter: grayscale(1) opacity(.5); }
.btn.big { width: calc(100% - 8px); font-size: 14px; min-height: 62px; }
.btn img.px { width: 28px; height: 28px; }
.btn.quiet { font-size: 11px; min-height: 44px; padding: 12px; }
.row2 { display: flex; gap: 8px; }
.row2 > .btn { flex: 1; font-size: 11px; padding-left: 8px; padding-right: 8px; }
.dock {
  margin-top: auto; padding-top: 16px;
  position: sticky; bottom: 0;
  background: linear-gradient(180deg, rgba(255, 243, 226, 0), var(--bg) 24px);
  z-index: 3;
}
.dock.row2 { display: flex; }

.ibtn {
  width: 44px; height: 44px; display: grid; place-items: center; flex: none;
  background: var(--paper); color: var(--ink);
  box-shadow: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink), 0 8px 0 0 rgba(43, 33, 64, .18);
  margin: 4px;
}
.ibtn:active { transform: translateY(2px); }
.ibtn svg { width: 22px; height: 22px; }
.ibtn.ghost { visibility: hidden; }

.bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.bar h1 { flex: 1; margin: 0; font: 13px/1.5 var(--head); text-align: center; text-transform: uppercase; letter-spacing: .5px; }
.step { font: 11px var(--head); background: var(--ink); color: #fff; padding: 7px 8px 6px; }

/* ---------- Home ---------- */
.home { padding-top: calc(6px + env(safe-area-inset-top)); }
.home-top { display: flex; justify-content: flex-end; }
.logo { text-align: center; margin: -4px 0 6px; }
.logo-word { display: flex; justify-content: center; gap: 2px; }
.logo-word span {
  font: clamp(28px, 9vw, 42px)/1.15 var(--head);
  color: var(--c);
  text-shadow: 3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink),
    0 3px 0 var(--ink), 0 -3px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 3px 7px 0 var(--ink);
  display: inline-block;
  animation: letterBob 1.6s steps(2) infinite;
  animation-delay: var(--d);
}
.logo-word:nth-child(2) span { font-size: clamp(32px, 11vw, 50px); }
@keyframes letterBob { 50% { transform: translateY(-4px); } }
.parade { display: flex; justify-content: center; gap: 6px; margin: 10px 0 14px; min-height: 52px; }
.parade img { width: 48px; height: 48px; }
.hop { animation: hop .9s steps(2) infinite; }
@keyframes hop { 50% { transform: translateY(-5px); } }

.pcard { display: block; width: calc(100% - 8px); text-align: left; padding: 12px 14px; background: var(--cream); }
.pcard-head { display: flex; align-items: center; gap: 10px; }
.pcard .label { font: 12px var(--head); text-transform: uppercase; }
.pcard .count { font: 11px var(--head); background: var(--purple); color: #fff; padding: 5px 7px 4px; }
.pcard .edit { margin-left: auto; font: 10px var(--head); color: var(--ink-soft); text-transform: uppercase; }
.pcard-body { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 10px; }
.pcard .empty { color: var(--ink-soft); }
.mini { display: inline-flex; flex-direction: column; align-items: center; width: 56px; font-size: 13px; line-height: 1.1; }
.mini img { width: 40px; height: 40px; }
.mini span { max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }

.games { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.tile {
  display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px;
  width: calc(100% - 8px); background: var(--c);
  box-shadow:
    0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink),
    0 8px 0 0 var(--ink), inset 0 -4px 0 0 rgba(0, 0, 0, .15), inset 4px 4px 0 0 rgba(255, 255, 255, .3);
  margin-bottom: 8px;
}
.tile:active { transform: translateY(4px); }
.tile-art { width: 68px; height: 68px; flex: none; background: rgba(255, 255, 255, .9); display: grid; place-items: center;
  box-shadow: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink); margin: 4px; }
.tile-art img { width: 56px; height: 56px; }
.tile:nth-child(1) .tile-art img { animation: hop 1.4s steps(2) infinite; }
.tile:nth-child(2) .tile-art img { animation: shakeTiny .5s steps(2) infinite; }
.tile:nth-child(3) .tile-art img { animation: spinCoin 1.6s steps(4) infinite; }
@keyframes shakeTiny { 50% { transform: rotate(-6deg); } }
@keyframes spinCoin { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.3); } }
.tile-text { flex: 1; display: flex; flex-direction: column; color: #fff; }
.tile-name { font: 13px/1.4 var(--head); text-transform: uppercase; text-shadow: 2px 2px 0 var(--ink); }
.tile-desc { font-size: 16px; line-height: 1.2; margin-top: 4px; text-shadow: 1px 1px 0 rgba(43, 33, 64, .5); }
.tile-min { font-size: 13px; margin-top: 4px; opacity: .9; }
.tile-min.warn { background: var(--ink); align-self: flex-start; padding: 0 6px; opacity: 1; }
.tile-go { font-size: 18px; color: #fff; text-shadow: 2px 2px 0 var(--ink); }
.foot { text-align: center; color: var(--ink-soft); font-size: 15px; margin: 16px 0 4px; }

/* ---------- Players ---------- */
.plist { display: flex; flex-direction: column; gap: 10px; }
.prow { display: flex; align-items: center; gap: 10px; padding: 8px; }
.ava-btn { position: relative; width: 60px; height: 60px; flex: none; background: #f4efff; display: grid; place-items: center; }
.ava-btn img { width: 52px; height: 52px; }
.ava-btn .swap { position: absolute; right: -4px; bottom: -4px; font-size: 13px; background: var(--yellow); width: 20px; height: 20px; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--ink); }
.pname {
  flex: 1; min-width: 0; font: 20px var(--body); color: var(--ink);
  border: 0; background: var(--cream); padding: 10px 10px; outline: none;
  box-shadow: inset 0 0 0 3px #e8dcf6; -webkit-user-select: text; user-select: text;
}
.pname:focus { box-shadow: inset 0 0 0 3px var(--purple); }
.pname::placeholder { color: #b7aec8; }
.xbtn { width: 40px; height: 40px; flex: none; font-size: 18px; color: var(--red); background: #ffeef1; }
.btn.add { width: calc(100% - 8px); margin-top: 16px; }
.empty-hero { text-align: center; color: var(--ink-soft); margin-top: 20px; }
.empty-hero img { width: 80px; height: 80px; margin: 0 auto; }

.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; max-height: 60vh; overflow-y: auto; padding: 4px; }
.cpick { position: relative; display: flex; flex-direction: column; align-items: center; padding: 6px 2px; background: var(--cream); font-size: 14px; box-shadow: inset 0 0 0 3px #eee4f8; }
.cpick img { width: 52px; height: 52px; }
.cpick.on { background: #fff3b0; box-shadow: inset 0 0 0 4px var(--ink); }
.cpick.used img { opacity: .45; }
.cpick em { position: absolute; top: 2px; left: 2px; right: 2px; font-style: normal; font-size: 11px; background: var(--ink); color: #fff; padding: 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Panels, chips, toggles ---------- */
.panel { padding: 14px; margin-bottom: 14px; }
.panel h2 { font: 11px/1.4 var(--head); text-transform: uppercase; margin: 0 0 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.row-between h2 { margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 6px; background: #f1edf7; color: var(--ink-soft); font-size: 16px; box-shadow: inset 0 0 0 3px #e2daee; }
.chip img { width: 28px; height: 28px; filter: grayscale(1) opacity(.55); }
.chip.on { background: #fff3b0; color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink); }
.chip.on img { filter: none; }
.seg { display: flex; gap: 8px; }
.segb { flex: 1; padding: 12px 0 10px; font: 13px var(--head); text-transform: uppercase; background: #f1edf7; box-shadow: inset 0 0 0 3px #e2daee; color: var(--ink-soft); }
.segb.on { background: var(--yellow); color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink), inset 0 -6px 0 0 rgba(0, 0, 0, .12); }
.segb:disabled { opacity: .35; }
.seg.big .segb { padding: 16px 0 14px; }
.tog { position: relative; width: 84px; height: 40px; flex: none; background: #e2daee; box-shadow: inset 0 0 0 3px var(--ink); font: 9px var(--head); }
.tog-knob { position: absolute; top: 6px; left: 6px; width: 28px; height: 28px; background: #fff; box-shadow: inset 0 0 0 3px var(--ink), inset 0 -5px 0 0 rgba(0,0,0,.12); transition: left .12s steps(3); }
.tog-on, .tog-off { position: absolute; top: 15px; }
.tog-on { left: 12px; color: #fff; opacity: 0; }
.tog-off { right: 10px; color: var(--ink-soft); }
.tog.on { background: var(--green); }
.tog.on .tog-knob { left: 50px; }
.tog.on .tog-on { opacity: 1; }
.tog.on .tog-off { opacity: 0; }
.how ol { margin: 0; padding-left: 22px; }
.how li { margin: 4px 0; font-size: 16px; }
.how li::marker { font: 10px var(--head); color: var(--purple); }

/* ---------- Modal + toast ---------- */
#modal { position: fixed; inset: 0; z-index: 50; display: none; }
#modal.open { display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: rgba(43, 33, 64, .55); animation: fade .15s both; }
.sheet { position: relative; width: min(500px, calc(100% - 24px)); padding: 18px 14px 10px; margin-bottom: calc(18px + env(safe-area-inset-bottom)); animation: rise .2s steps(4) both; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.m-title { font: 12px var(--head); text-transform: uppercase; margin: 0 0 12px; text-align: center; }
.m-text { font-size: 20px; text-align: center; margin: 6px 0 18px; }
#toasts { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 0; right: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
.toast { padding: 10px 14px; max-width: 92vw; font-size: 17px; background: #fff8cc; animation: rise .18s steps(3) both; }
.toast.out { opacity: 0; transition: opacity .3s; }

/* ---------- Imposter ---------- */
.pass-to { text-align: center; margin: 0 0 14px; font-size: 19px; }
.peek { position: relative; height: min(56vh, 420px); min-height: 330px; margin: 4px 4px 8px; }
.secret, .cover { position: absolute; inset: 0; margin: 0; }
.secret { display: flex; align-items: flex-end; justify-content: center; padding: 16px 12px 22px; background: var(--cream); }
.secret.is-imp { background: #ffe1e8; }
.sec { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.sec-art { width: 104px; height: 104px; }
.sec-word { font: 20px/1.4 var(--head); text-transform: uppercase; overflow-wrap: anywhere; }
.sec-small { color: var(--ink-soft); font-size: 16px; }
.sec-imp { font: 13px/1.6 var(--head); color: var(--ink); text-transform: uppercase; }
.sec-imp b { font-size: 22px; color: var(--red); text-shadow: 2px 2px 0 var(--ink); }
.hint { padding: 8px 14px; background: #fff3b0; font-size: 19px; margin-top: 6px; }
.cover {
  z-index: 5; cursor: grab; touch-action: none;
  background: var(--c);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  will-change: transform; overflow: hidden;
}
.cover.grab { cursor: grabbing; }
.cover-stripes { position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.12) 0 16px, rgba(255,255,255,0) 16px 32px); pointer-events: none; }
.cover-ava { width: 120px; height: 120px; position: relative; animation: hop 1s steps(2) infinite; }
.cover-name { position: relative; font: 20px/1.4 var(--head); color: #fff; text-shadow: 3px 3px 0 var(--ink); text-align: center; padding: 0 10px; overflow-wrap: anywhere; }
.cover-tip { position: relative; display: flex; flex-direction: column; align-items: center; color: #fff; font: 11px/1.6 var(--head); text-transform: uppercase; margin-top: 10px; text-shadow: 2px 2px 0 var(--ink); }
.cover-tip small { font: 15px var(--body); text-transform: none; opacity: .9; text-shadow: 1px 1px 0 var(--ink); }
.arrows { display: flex; flex-direction: column; align-items: center; margin-bottom: 4px; }
.arrows i { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 10px solid #fff; margin-top: -2px; opacity: .3; animation: arrowUp 1.2s steps(1) infinite; }
.arrows i:nth-child(1) { animation-delay: .8s; }
.arrows i:nth-child(2) { animation-delay: .4s; }
@keyframes arrowUp { 0%, 66% { opacity: .3; } 33% { opacity: 1; } }
.cover::after { content: ''; position: absolute; left: 50%; bottom: 10px; width: 56px; height: 8px; margin-left: -28px; background: rgba(255,255,255,.6); box-shadow: 0 0 0 3px var(--ink); }
.wobble { animation: wobble 1s steps(2) infinite; }
@keyframes wobble { 50% { transform: rotate(-8deg); } }

.hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
.big-title { font: 17px/1.5 var(--head); text-transform: uppercase; margin: 6px 0 14px; text-align: center; }
.starter { display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 10px; text-align: left; background: #fff3b0; }
.starter img { width: 64px; height: 64px; }
.starter b { display: block; font: 15px/1.5 var(--head); }
.crowd { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 6px 0; }
.reveal-btn { font-size: 15px; }
.suspense { justify-content: center; align-items: center; text-align: center; gap: 24px; }
.drum-text { font: 16px/1.6 var(--head); text-transform: uppercase; }
.dots i { font-style: normal; animation: blink .6s steps(1) infinite; }
.dots i:nth-child(2) { animation-delay: .2s; }
.dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: 0; } }
.big-q { width: 140px; height: 140px; }
.reveal { display: flex; flex-direction: column; align-items: center; text-align: center; }
.kicker { font: 13px/1.6 var(--head); text-transform: uppercase; margin: 8px 0 14px; }
.imps { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.imp-card { display: flex; flex-direction: column; align-items: center; padding: 14px 18px; background: #ffe1e8; }
.imp-card img { width: 120px; height: 120px; }
.imp-card b { font: 15px/1.5 var(--head); margin-top: 6px; }
.pop { animation: popIn .45s steps(5) both; }
@keyframes popIn { 0% { transform: scale(.2); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
.shake-slow { animation: shakeTiny .4s steps(2) infinite; }
.word-card { display: flex; flex-direction: column; align-items: center; padding: 14px 24px; margin-top: 24px; gap: 4px; }
.word-card img { width: 72px; height: 72px; }
.word-card b { font: 16px/1.5 var(--head); text-transform: uppercase; }

/* ---------- Bomb ---------- */
.cat { display: flex; align-items: center; gap: 12px; padding: 10px 12px; text-align: left; background: #fff3b0; width: calc(100% - 8px); }
.cat-art { width: 56px; height: 56px; flex: none; }
.cat-text { display: flex; flex-direction: column; }
.cat-text b { font: 14px/1.5 var(--head); text-transform: uppercase; overflow-wrap: anywhere; }
.cat.small { padding: 6px 10px; margin: 4px 4px 14px; }
.cat.small .cat-art { width: 40px; height: 40px; }
.cat.small b { font-size: 11px; }
.starter-line { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 14px 0 0; font-size: 19px; text-align: left; }
.starter-line img { width: 44px; height: 44px; flex: none; }
.bomb-stage { position: relative; display: flex; flex-direction: column; align-items: center; margin: 6px 0 0; }
.bomb-wrap { position: relative; width: min(66vw, 270px); aspect-ratio: 1; }
.bomb-img { width: 100%; height: 100%; }
.bomb-shadow { width: min(40vw, 160px); height: 12px; background: rgba(43, 33, 64, .15); margin-top: -18px; }
.bomb-wrap.idle { animation: sway 2.4s steps(4) infinite; transform-origin: 50% 90%; }
@keyframes sway { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
.bomb-wrap.s1 { animation: sway 1.6s steps(4) infinite; transform-origin: 50% 90%; }
.bomb-wrap.s2 { animation: jiggle .45s steps(2) infinite; }
.bomb-wrap.s3 { animation: rattle .09s steps(2) infinite; }
@keyframes jiggle { 50% { transform: scale(1.04) rotate(2deg); } }
@keyframes rattle { 0% { transform: translate(-4px, 2px) rotate(-3deg) scale(1.06); } 100% { transform: translate(4px, -2px) rotate(3deg) scale(1.06); } }
.bomb-wrap.gone, .bomb-shadow.gone { visibility: hidden; }
.spark { position: absolute; left: calc(100% * 19 / 24); top: 0; width: calc(100% * 5 / 24); aspect-ratio: 1; }
.spark img { position: absolute; inset: 0; width: 100%; height: 100%; }
.spark .b { animation: blink .16s steps(1) infinite; }
.spark .a { animation: blink .16s steps(1) infinite reverse; animation-delay: .08s; }
.status { text-align: center; font-size: 19px; margin: 12px 0 0; min-height: 28px; }
.status.st2 { color: var(--red); font-weight: 700; }
.status.st3 { color: var(--red); font: 16px/1.6 var(--head); animation: blink .2s steps(1) infinite; }
.status.boom { margin-top: -160px; }
.boom-word { display: inline-block; font: 54px/1 var(--head); color: var(--yellow); text-shadow: 4px 4px 0 var(--ink), -4px 4px 0 var(--ink), 4px -4px 0 var(--ink), -4px -4px 0 var(--ink), 0 8px 0 var(--red); animation: popIn .4s steps(5) both; }
body.shake #app { animation: bigShake .08s steps(2) infinite; }
@keyframes bigShake { 0% { transform: translate(-8px, 4px); } 100% { transform: translate(8px, -6px); } }
body.flash::after { content: ''; position: fixed; inset: 0; background: #fff; z-index: 40; animation: flashOut .5s steps(5) forwards; pointer-events: none; }
@keyframes flashOut { 0% { opacity: 1; background: #fff; } 40% { background: var(--yellow); } 100% { opacity: 0; } }
#fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 45; }
.boom-art img { width: 96px; height: 96px; }
.who-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.who { display: flex; flex-direction: column; align-items: center; padding: 10px 4px 8px; font-size: 16px; }
.who img { width: 56px; height: 56px; }
.who span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who:active { background: #ffe1e8; transform: translateY(2px); }
.loser { position: relative; margin-top: 6px; }
.loser img { width: 120px; height: 120px; }
.charred { filter: brightness(.55) sepia(.6) saturate(.8); animation: wobble .6s steps(2) infinite; }
.soot { position: absolute; left: 50%; top: -14px; width: 40px; height: 16px; margin-left: -20px; background: radial-gradient(circle, #8a8399 40%, transparent 42%) 0 0 / 12px 12px; opacity: .8; animation: hop 1s steps(2) infinite; }
.board { width: calc(100% - 8px); padding: 12px 12px 6px; text-align: left; }
.board h2 { font: 11px var(--head); text-transform: uppercase; margin: 0 0 8px; }
.brow { display: flex; align-items: center; gap: 8px; padding: 4px 4px; }
.brow + .brow { border-top: 3px dotted #eee4f8; }
.brow.hot { background: #ffe1e8; }
.brow > img { width: 36px; height: 36px; flex: none; }
.bname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bombs { display: flex; align-items: center; gap: 1px; }
.bombs img { width: 24px; height: 24px; }
.link { display: block; margin: 8px auto 4px; font-size: 15px; color: var(--ink-soft); text-decoration: underline; }

/* ---------- Draft ---------- */
.lot { position: relative; display: flex; flex-direction: column; align-items: center; padding: 10px 12px 10px; background: var(--cream); }
.lot-set { font: 9px var(--head); text-transform: uppercase; color: var(--ink-soft); }
.lot-art { width: 104px; height: 104px; margin: 4px 0 0; background: radial-gradient(circle, #fff3b0 0 55%, transparent 56%); display: grid; place-items: center; }
.lot-art img { width: 88px; height: 88px; }
.lot-name { font: 16px/1.5 var(--head); text-transform: uppercase; text-align: center; }
.bidline { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 8px 0 4px; font-size: 18px; flex-wrap: wrap; }
.bidline img { width: 28px; height: 28px; }
.bidline.none { color: var(--ink-soft); }
.bid { font: 15px var(--head); color: var(--green); }
.turn { padding: 10px 12px 2px; }
.turn-who { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.turn-who img { width: 44px; height: 44px; }
.turn-who b { font: 12px/1.6 var(--head); text-transform: uppercase; display: block; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
.sbtn { width: 48px; height: 48px; font: 22px var(--head); background: var(--paper); box-shadow: inset 0 0 0 4px var(--ink), inset 0 -6px 0 0 rgba(0,0,0,.12); }
.sbtn:active { transform: translateY(2px); }
.sbtn.maxb { width: auto; padding: 0 10px; font-size: 11px; background: #fff3b0; }
.amt { min-width: 96px; text-align: center; font: 28px var(--head); color: var(--green); text-shadow: 3px 3px 0 var(--ink); }
.sold-banner { display: flex; flex-direction: column; align-items: center; padding: 14px; background: #dff7e9; text-align: center; }
.sold-banner.nope { background: #f1edf7; }
.stamp { font: 26px var(--head); color: var(--red); border: 4px solid var(--red); padding: 10px 14px 6px; transform: rotate(-6deg); animation: stamp .35s steps(4) both; background: #fff; }
.stamp.free { color: var(--purple); border-color: var(--purple); font-size: 20px; }
.nope .stamp { color: var(--ink-soft); border-color: var(--ink-soft); font-size: 18px; }
@keyframes stamp { 0% { transform: scale(2.4) rotate(-6deg); opacity: 0; } 100% { transform: scale(1) rotate(-6deg); opacity: 1; } }
.sold-to { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 19px; }
.sold-to img { width: 48px; height: 48px; }
.tabs { display: flex; gap: 8px; margin: 0 4px 14px; }
.tab { flex: 1; padding: 12px 0 10px; font: 11px var(--head); text-transform: uppercase; background: #f1edf7; box-shadow: inset 0 0 0 3px #e2daee; color: var(--ink-soft); }
.tab.on { background: var(--ink); color: #fff; box-shadow: none; }
.teams { display: flex; flex-direction: column; gap: 14px; }
.team { padding: 10px 10px 12px; }
.team.crowned { background: #fff3b0; }
.team-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.team-head > img { width: 52px; height: 52px; }
.team-head > div { flex: 1; min-width: 0; }
.team-head b { font: 13px/1.6 var(--head); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crown-btn { width: 52px; height: 52px; display: grid; place-items: center; background: #f1edf7; box-shadow: inset 0 0 0 3px #e2daee; }
.crown-btn img { width: 36px; height: 36px; filter: grayscale(1) opacity(.4); }
.crown-btn.on { background: var(--yellow); box-shadow: inset 0 0 0 3px var(--ink); }
.crown-btn.on img { filter: none; animation: hop .8s steps(2) infinite; }
.team-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.titem { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px 4px; background: var(--cream); box-shadow: inset 0 0 0 3px #eee4f8; font-size: 14px; line-height: 1.15; }
.titem img { width: 48px; height: 48px; margin-bottom: 2px; }
.titem b { font: 10px/1.6 var(--head); color: var(--green); }
img.inline { display: inline-block; width: 22px; height: 22px; vertical-align: -5px; }
.side-wrap { overflow-x: auto; margin: 0 -16px; padding: 4px 16px 10px; }
.side { border-collapse: separate; border-spacing: 6px; }
.side th, .side td { background: var(--paper); box-shadow: inset 0 0 0 3px #e2daee; padding: 6px; text-align: center; min-width: 92px; vertical-align: top; font-size: 14px; line-height: 1.15; }
.side th { background: #f4efff; font-weight: 400; }
.side th img, .side td img { width: 44px; height: 44px; margin: 0 auto 2px; }
.side th span { display: block; max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side td b { display: block; font: 10px/1.6 var(--head); color: var(--green); }
.side td.pickno, .side tr.tot td:first-child { min-width: 28px; font: 11px var(--head); background: var(--ink); color: #fff; box-shadow: none; vertical-align: middle; }
.side th:first-child { background: none; box-shadow: none; min-width: 28px; }
.side tr.tot td { font: 9px/1.5 var(--head); background: #dff7e9; }

@media (min-width: 560px) {
  .screen { padding-top: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; }
}

.draft .bar { margin-bottom: 10px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.panel-head h2 { margin: 0; }
.allnone { display: flex; gap: 6px; }
.allnone button { font: 9px var(--head); text-transform: uppercase; padding: 8px 8px 6px; background: #f1edf7; box-shadow: inset 0 0 0 3px var(--ink); }
.allnone button:active { background: var(--yellow); }
.pick-note { margin: 0 0 10px; }

/* ---------- Imposter: who goes first + reveal ---------- */
.talk { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding-bottom: 40px; }
.first { display: flex; flex-direction: column; align-items: center; padding: 16px 28px 14px; background: #fff3b0; }
.first img { width: 96px; height: 96px; margin-bottom: 6px; }
.first b { font: 18px/1.5 var(--head); text-align: center; overflow-wrap: anywhere; }
.talk .reveal-btn { min-height: 76px; font-size: 15px; }

/* ---------- Bomb on the table ---------- */
.bomb-live { justify-content: center; align-items: center; position: relative; min-height: 100vh; min-height: 100dvh; }
.bomb-live .bomb-wrap { width: min(94vw, 64vh, 500px); }
.live-cat { position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 60px; right: 60px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; color: var(--ink-soft); text-align: center; }
.live-cat img { width: 26px; height: 26px; flex: none; opacity: .8; }
.live-stop { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; width: 40px; height: 40px; font-size: 16px; color: var(--ink-soft); background: rgba(255,255,255,.6); box-shadow: inset 0 0 0 3px #e2daee; }
.boom-center { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.boom-center .boom-word { font-size: clamp(54px, 18vw, 96px); }

/* ---------- Draft: a column per player ---------- */
.pcols { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 10px; padding: 6px 16px 4px; scrollbar-width: none; }
.pcols::-webkit-scrollbar { display: none; }
.pcol { flex: 1 0 66px; max-width: 110px; display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 4px; background: var(--paper); box-shadow: inset 0 0 0 3px #e2daee; position: relative; }
.pcol-head { display: flex; flex-direction: column; align-items: center; padding-bottom: 2px; }
.pcol-head img { width: 32px; height: 32px; }
.pick { height: 40px; display: flex; align-items: center; justify-content: center; gap: 2px; background: var(--cream); box-shadow: inset 0 0 0 2px #eee4f8; }
.pick img { width: 30px; height: 30px; }
.pick b { font: 8px var(--head); color: var(--green); }
.pick.empty { background: repeating-linear-gradient(45deg, #f6f2fb 0 4px, #fff 4px 8px); box-shadow: inset 0 0 0 2px #e8e0f2; }
.pcol.turn { background: #fff3b0; box-shadow: inset 0 0 0 4px var(--ink); }
.pcol.turn::before { content: ''; position: absolute; top: -6px; left: 50%; margin-left: -6px; border: 6px solid transparent; border-top-color: var(--ink); }
.pcol.lead { background: #dff7e9; box-shadow: inset 0 0 0 4px var(--green); }
.pcol.out .pcol-head, .pcol.broke .pcol-head, .pcol.full .pcol-head { opacity: .5; }
.pcol.out::after, .pcol.broke::after, .pcol.full::after { position: absolute; top: 14px; left: 50%; transform: translateX(-50%) rotate(-12deg); font: 8px var(--head); color: #fff; padding: 3px 4px 2px; box-shadow: 0 0 0 2px var(--ink); }
.pcol.out::after { content: 'PASS'; background: var(--ink); }
.pcol.broke::after { content: 'BROKE'; background: var(--red); }
.pcol.full::after { content: 'FULL'; background: var(--green); }
.pcol.broke .w-money { color: var(--red); }
.draft .lot { flex-direction: row; align-items: center; gap: 12px; padding: 8px 12px; text-align: left; }
.draft .lot-art { width: 84px; height: 84px; flex: none; margin: 0; }
.draft .lot-art img { width: 72px; height: 72px; }
.draft .lot-name { text-align: left; font-size: 15px; }
.lot-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.w-name { font-size: 13px; line-height: 1.1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.w-money { font: 10px/1.6 var(--head); color: var(--green); }

</style>

// ---- Rendering ---------------------------------------------------------------
function expandRows(rows, w) {
  return rows.map(r => r.length === w ? r : (r.length === w / 2 ? r + [...r].reverse().join('') : r));
}
function spriteRows(key) {
  if (CHARS[key]) return expandRows(CHARS[key].rows, 16);
  if (ICONS[key]) return expandRows(ICONS[key], 12);
  return null;
}
const _sprCache = {};
function sprURL(key, fill) {
  if (typeof key === 'string' && typeof ICON_ALIAS !== 'undefined' && ICON_ALIAS[key] && !fill) return sprURL(ICON_ALIAS[key][0], ICON_ALIAS[key][1]);
  const ck = key + (fill ? JSON.stringify(fill) : '');
  if (_sprCache[ck]) return _sprCache[ck];
  const rows = typeof key === 'string' ? spriteRows(key) : key;
  if (!rows) return '';
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const size = Math.max(w, h);
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const x = c.getContext('2d');
  const ox = Math.floor((size - w) / 2), oy = Math.floor((size - h) / 2);
  rows.forEach((row, j) => [...row].forEach((ch, i) => {
    if (ch === '.' || ch === ' ') return;
    x.fillStyle = (fill && fill[ch]) || PAL[ch] || '#f0f';
    x.fillRect(ox + i, oy + j, 1, 1);
  }));
  return (_sprCache[ck] = c.toDataURL());
}

// The bomb is drawn procedurally so its body can flash between colours.
function bombRows(lit) {
  const W = 24, H = 24, cx = 11.5, cy = 14, R = 8.6;
  const g = Array.from({ length: H }, () => Array(W).fill('.'));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const d = Math.hypot(x + 0.5 - cx - 0.5, y + 0.5 - cy - 0.5);
    if (d <= R) g[y][x] = d > R - 1.15 ? 'k' : (lit ? 'r' : 'G');
  }
  // shine
  for (const [x, y] of [[7, 9], [8, 9], [6, 10], [7, 10], [6, 11], [6, 12], [9, 8]]) g[y][x] = lit ? 'm' : 'g';
  if (lit) for (const [x, y] of [[5, 15], [6, 17], [16, 18], [17, 16], [13, 20]]) g[y][x] = 'R';
  // cap
  for (let y = 3; y <= 6; y++) for (let x = 14; x <= 18; x++) {
    const edge = y === 3 || y === 6 || x === 14 || x === 18;
    g[y][x] = edge ? 'k' : 'g';
  }
  // fuse
  for (const [x, y] of [[17, 2], [18, 1], [19, 1], [20, 1], [21, 2]]) g[y][x] = 'T';
  return g.map(r => r.join(''));
}

// Adds a 1px ink outline around every coloured pixel (for thin shapes).
function outlined(rows) {
  const g = rows.map(r => [...r]);
  const at = (x, y) => (g[y] && g[y][x]) || '.';
  return g.map((row, y) => row.map((ch, x) => {
    if (ch !== '.') return ch;
    const near = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const c = at(x + dx, y + dy); return c !== '.' && c !== 'k'; });
    return near ? 'k' : '.';
  }).join(''));
}

'use strict';

const MAX_PLAYERS = 12;
const COVER_COLORS = ['#9b6bff', '#ff7eb6', '#4b9dff', '#2fbf71', '#ff9f40', '#ff5a78', '#25b9d1', '#e8a317'];

// ---- Helpers -----------------------------------------------------------------
const $ = (s, r = document) => r.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const randIn = ([lo, hi]) => lo + Math.random() * (hi - lo);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const img = (key, cls = '', extra = '') => `<img class="px ${cls}" src="${sprURL(key)}" alt="" draggable="false" ${extra}>`;

const store = {
  get(k, d) { try { const v = localStorage.getItem('fpg.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fpg.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};

// ---- State -------------------------------------------------------------------
function cleanPlayers(list) {
  if (!Array.isArray(list)) return [];

// ---- Sound (tiny chiptune synth) ----------------------------------------------
const sfx = (() => {
  let ctx = null, noiseBuf = null;
  function ac() {
    if (!ctx) {
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return null;
      try { ctx = new A(); } catch (e) { return null; }
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function tone(f, d, { type = 'square', v = 0.07, to, at = 0 } = {}) {
    if (S.muted) return;
    const c = ac(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + d + 0.05);
  }
  function noise(d, v, from, to) {
    if (S.muted) return;
    const c = ac(); if (!c) return;
    if (!noiseBuf) {
      noiseBuf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    }
    const t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noiseBuf; f.type = 'lowpass';
    f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(t); s.stop(t + d);
  }
  const notes = (fs, step, o = {}) => fs.forEach((f, i) => tone(f, step * 1.7, Object.assign({}, o, { at: i * step })));
  return {
    unlock: ac,
    click: () => tone(560, 0.05, { v: 0.035 }),
    pop: () => tone(420, 0.12, { to: 940, v: 0.06 }),
    beep: f => tone(f, 0.08, { v: 0.09 }),
    fuse: () => noise(0.6, 0.18, 7000, 1500),
    boom: () => { noise(2.2, 0.9, 2600, 40); tone(150, 1.1, { type: 'sawtooth', to: 28, v: 0.22 }); },
    coin: () => notes([988, 1319], 0.07, { v: 0.06 }),
    pass: () => tone(320, 0.16, { to: 170, v: 0.06, type: 'triangle' }),
    sold: () => notes([523, 659, 784, 1047], 0.08, { v: 0.06 }),
    sad: () => notes([392, 330, 262], 0.14, { v: 0.05, type: 'triangle' }),
    fanfare: () => notes([392, 523, 659, 784, 659, 1047], 0.1, { v: 0.06 }),
    drum: () => noise(0.07, 0.3, 1800, 300),
    err: () => tone(170, 0.18, { v: 0.05 }),
  };
})();
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) { /* unsupported */ } };

// ---- Particles (confetti + explosions) ----------------------------------------
const fx = (() => {
  const c = $('#fx'), x = c.getContext('2d');
  let P = [], raf = 0, dpr = 1;
  function size() { dpr = Math.min(2, window.devicePixelRatio || 1); c.width = innerWidth * dpr; c.height = innerHeight * dpr; }
  size(); addEventListener('resize', size);
  function step() {
    x.clearRect(0, 0, c.width, c.height);
    P = P.filter(p => --p.life > 0 && p.y < innerHeight + 40);
    for (const p of P) {
      p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy;
      x.globalAlpha = Math.min(1, p.life / 25);
      x.fillStyle = p.c;
      x.fillRect(Math.round(p.x) * dpr, Math.round(p.y) * dpr, p.s * dpr, p.s * dpr);
    }
    x.globalAlpha = 1;
    raf = P.length ? requestAnimationFrame(step) : 0;
  }
  const add = list => { P.push(...list); if (!raf) raf = requestAnimationFrame(step); };
  return {
    confetti() {
      const cols = [PAL.r, PAL.y, PAL.b, PAL.e, PAL.p, PAL.m, PAL.o, PAL.c];
      add(Array.from({ length: 140 }, () => ({
        x: Math.random() * innerWidth, y: -10 - Math.random() * innerHeight * 0.6,
        vx: (Math.random() - 0.5) * 2, vy: 1 + Math.random() * 2.5, g: 0.04, drag: 0.995,
        s: pick([6, 8, 10]), c: pick(cols), life: 260 + rnd(120),
      })));
    },
    explode(cx, cy) {
      const cols = [PAL.y, PAL.y, PAL.o, PAL.o, PAL.r, PAL.w, PAL.G, PAL.k];
      add(Array.from({ length: 220 }, () => {
        const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 15;
        return { x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, g: 0.28, drag: 0.955, s: pick([6, 8, 10, 12, 16]), c: pick(cols), life: 50 + rnd(70) };
      }));
    },
    clear() { P = []; },
  };
})();

const app = $('#app'), modalRoot = $('#modal'), toastRoot = $('#toasts');
let ACT = {}, MACT = {}, timers = [];
let R = null;       // current Imposter round
let B = null;       // current Bomb round
let D = null;       // current Draft

function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
function render(html, actions = {}, { keepScroll = false } = {}) {
  timers.forEach(clearTimeout); timers = [];
  closeModal();
  const y = window.scrollY;
  app.innerHTML = html;
  ACT = actions;
  window.scrollTo(0, keepScroll ? y : 0);
  if (actions.back && history.state !== 'fpg') { try { history.pushState('fpg', ''); } catch (e) { /* file:// on some browsers */ } }
}
const GLOBAL = {
  mute(el) {
    S.muted = !S.muted; store.set('muted', S.muted);
    document.querySelectorAll('[data-a="mute"]').forEach(b => { b.innerHTML = muteIcon(); b.setAttribute('aria-label', S.muted ? 'Sound off' : 'Sound on'); });
    if (!S.muted) sfx.pop();
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const inModal = !!el.closest('#modal');
  const fn = (inModal ? MACT : ACT)[el.dataset.a] || GLOBAL[el.dataset.a];
  if (!fn) return;
  if (el.dataset.a !== 'mute') sfx.click();
  fn(el, e);
});
document.addEventListener('pointerdown', () => sfx.unlock(), { once: true });
document.addEventListener('input', e => {
  if (e.target.matches('.pname')) {
    const p = S.players[+e.target.dataset.i];
    if (p) { p.name = e.target.value.slice(0, 14); savePlayers(); }

});
document.addEventListener('keydown', e => {

});
window.addEventListener('popstate', () => {
  if (modalRoot.classList.contains('open')) { closeModal(); history.pushState('fpg', ''); return; }

function modal(html, actions = {}) {

}

function confirmBox(text, yes, onYes) {

function toast(msg, ms = 2000) {
  toastRoot.innerHTML = '';   // one at a time, newest wins
  const t = document.createElement('div');
  t.className = 'toast box';
  t.innerHTML = msg;
  toastRoot.appendChild(t);
  setTimeout(() => t.classList.add('out'), ms);
  setTimeout(() => t.remove(), ms + 400);
}

    go() { if (!S.imp.sets.length) { sfx.err(); return toast('Pick at least one word set'); } impStart(); },

function impStart() {
  const pool = ALL_ITEMS.filter(it => S.imp.sets.includes(it.set));
  let choices = pool.filter(it => !S.recent.includes(it.name));
  if (!choices.length) { S.recent = []; choices = pool; }
  const word = pick(choices);
  S.recent.push(word.name); if (S.recent.length > 40) S.recent.shift();
  const imps = new Set(shuffle(S.players).slice(0, S.imp.count).map(p => p.id));
  R = { word, imps, i: 0, starter: pick(S.players), hint: S.imp.hint };
  impPass();
}

function setupCover(el, onPeek) {
  let startY = null, dy = 0, h = 0, peeked = false;
  el.addEventListener('pointerdown', e => {
    startY = e.clientY; h = el.offsetHeight;
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    el.style.transition = 'none';
    el.classList.add('grab');
  });
  el.addEventListener('pointermove', e => {
    if (startY == null) return;
    dy = Math.max(-h * 0.94, Math.min(0, e.clientY - startY));
    el.style.transform = `translateY(${dy}px)`;
    if (!peeked && -dy > h * 0.45) { peeked = true; sfx.pop(); vibrate(15); onPeek(); }
  });
  const end = () => {
    if (startY == null) return;
    startY = null;
    el.classList.remove('grab');
    el.style.transition = 'transform .28s cubic-bezier(.25,.8,.35,1)';
    el.style.transform = 'translateY(0)';
    dy = 0;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('lostpointercapture', end);
}

function draftStart() {
  const mine = S.draft.set === 'mix' ? ALL_ITEMS : ALL_ITEMS.filter(i => i.set === S.draft.set);
  D = {
    picks: S.draft.picks, money: {}, team: {}, n: 0, lot: null, crown: null,
    pool: shuffle(mine), reserve: shuffle(ALL_ITEMS.filter(i => !mine.includes(i))), unsold: [],
  };
  S.players.forEach(p => { D.money[p.id] = BUDGET; D.team[p.id] = []; });
  draftNextLot();
}
const needs = p => D.picks - D.team[p.id].length;
const maxBid = p => D.money[p.id];
const minBid = () => (D.lot.holder ? D.lot.bid + 1 : 1);
const canAct = p => needs(p) > 0 && maxBid(p) >= minBid();
const broke = p => needs(p) > 0 && D.money[p.id] <= 0;
function draftNextLot() {
  if (S.players.every(p => needs(p) <= 0)) return draftResults();
  if (!D.pool.length) {
    if (D.reserve.length) { D.pool = D.reserve.splice(0, 6); toast('Bonus items from other sets!'); }
    else if (D.unsold.length) { D.pool = shuffle(D.unsold); D.unsold = []; }
    else D.pool = shuffle(ALL_ITEMS);
  }
  const item = D.pool.pop();
  D.n++;
  const bidders = S.players.filter(p => needs(p) > 0 && D.money[p.id] > 0);
  if (!bidders.length) {
    // Everyone still missing picks is out of money: hand out the leftovers for free,
    // to whoever has the fewest items.
    const fewest = Math.min(...S.players.filter(broke).map(p => D.team[p.id].length));
    const taker = pick(S.players.filter(p => broke(p) && D.team[p.id].length === fewest));
    D.team[taker.id].push(Object.assign({ price: 0 }, item));
    D.lot = { item, bid: 0, holder: taker.id, out: new Set(S.players.map(p => p.id)), turn: taker.id, amt: 0, done: true, free: true, fresh: true };
    D.freebies = (D.freebies || 0) + 1;
    draftScreen();
    sfx.coin();
    return;
  }
  const starter = pick(bidders);
  D.lot = { item, bid: 0, holder: null, out: new Set(S.players.filter(p => needs(p) <= 0 || broke(p)).map(p => p.id)), turn: starter.id, amt: 1, done: false, fresh: true };

}
function draftScreen() {

function draftAct(kind) {
  const L = D.lot, p = byId(L.turn);
  if (kind === 'bid') {
    if (L.amt < minBid() || L.amt > maxBid(p)) return;
    L.bid = L.amt; L.holder = p.id; sfx.coin();
  } else {
    L.out.add(p.id); sfx.pass();
  }
  const ps = S.players, from = ps.indexOf(p), skipped = [];
  for (let k = 1; k <= ps.length; k++) {
    const q = ps[(from + k) % ps.length];
    if (L.out.has(q.id) || q.id === L.holder) continue;
    if (!canAct(q)) { L.out.add(q.id); skipped.push(q); continue; }
    L.turn = q.id; L.amt = minBid();
    if (skipped.length) toast(`${skipped.map(s => `<b>${esc(nm(s))}</b>`).join(', ')} can't top $${L.bid}, skipped!`);
    return draftScreen();
  }
  if (skipped.length) toast(`${skipped.map(s => `<b>${esc(nm(s))}</b>`).join(', ')} can't top $${L.bid}, skipped!`);
  // Nobody left who can act: the lot is over.
  L.done = true;
  if (L.holder) {
    D.money[L.holder] -= L.bid;
    D.team[L.holder].push(Object.assign({ price: L.bid }, L.item));
  } else {
    D.unsold.push(L.item);
  }
  draftScreen();
  if (L.holder) sfx.sold(); else sfx.sad();
}

  const teams = ps.map(p => `
    <div class="team box ${D.crown === p.id ? 'crowned' : ''}">
      <div class="team-head">${img(p.char)}<div><b>${esc(nm(p))}</b><span class="tiny">Spent $${spent(p)} · $${D.money[p.id]} left</span></div>
        <button class="crown-btn ${D.crown === p.id ? 'on' : ''}" data-a="crown" data-id="${p.id}" aria-label="Crown ${esc(nm(p))}">${img('crown')}</button></div>
      <div class="team-items">${D.team[p.id].map(it => `<div class="titem">${img(it.icon)}<span>${esc(it.name)}</span><b>$${it.price}</b></div>`).join('')}</div>
    </div>`).join('');
  const side = `<div class="side-wrap"><table class="side">
    <thead><tr><th></th>${ps.map(p => `<th>${img(p.char)}<span>${esc(nm(p))}</span></th>`).join('')}</tr></thead>
    <tbody>${Array.from({ length: D.picks }, (_, i) => `<tr><td class="pickno">${i + 1}</td>${ps.map(p => {
      const it = D.team[p.id][i];
      return `<td>${it ? `${img(it.icon)}<span>${esc(it.name)}</span><b>$${it.price}</b>` : ''}</td>`;
    }).join('')}</tr>`).join('')}
    <tr class="tot"><td>$</td>${ps.map(p => `<td>$${spent(p)} spent</td>`).join('')}</tr></tbody></table></div>`;
  render(`<div class="screen">
    ${bar('Draft Results')}
    <h2 class="big-title center">Draft complete!</h2>
    <p class="sub center">Who built the best team? Argue it out, then tap ${img('crown', 'inline')} to crown a winner.</p>
    <div class="tabs"><button class="tab ${view === 'side' ? 'on' : ''}" data-a="side">Side by side</button><button class="tab ${view === 'teams' ? 'on' : ''}" data-a="teams">Team cards</button></div>
    ${view === 'teams' ? `<div class="teams">${teams}</div>` : side}
    <div class="dock row2"><button class="btn" data-a="home" style="--c:#fff">Home</button>
      <button class="btn" style="--c:var(--green)" data-a="again">New draft ▶</button></div>
  </div>`, {
    back: draftSetup, home, again: draftSetup,
    teams() { draftResults('teams'); },
    side() { draftResults('side'); },
    crown(el) {
      D.crown = D.crown === el.dataset.id ? null : el.dataset.id;
      if (D.crown) { sfx.fanfare(); fx.confetti(); }
      draftResults(view);
    },
  }, { keepScroll: !!D.celebrated });
  if (!D.celebrated) { D.celebrated = true; sfx.fanfare(); fx.confetti(); }
}

// ---- Boot -----------------------------------------------------------------------------
home();

// Offline support: once opened over https (or localhost), keep a copy on the
// device so the game also opens with no connection, e.g. from the Home Screen.
// Add ?reset to the address to throw away the saved copy and start fresh.
try {
  const servable = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if ('serviceWorker' in navigator && servable && window.top === window.self) {
    if (/[?&]reset/.test(location.search)) {
      Promise.all([
        navigator.serviceWorker.getRegistrations().then(rs => Promise.all(rs.map(r => r.unregister()))),
        window.caches ? caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))) : null,
      ]).catch(() => {}).then(() => location.replace(location.pathname));
    } else {
      navigator.serviceWorker.register('sw.js').catch(() => { /* offline copy is optional */ });
    }
  }
} catch (e) { /* not available here */ }

</script>
</body>
</html>
