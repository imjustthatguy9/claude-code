    file.addEventListener('change', async () => {
      const f = file.files[0];
      if (!f) return;
      try {
        const json = JSON.parse(await f.text());
        const days = json.days || {};
        const n = Object.keys(days).filter(E.isDate).length;
        if (!confirm(`Import ${n} day(s)? Days in the file replace the same days here.`)) return;
        for (const [d, v] of Object.entries(days)) if (E.isDate(d)) book.days[d] = E.cleanPrompts(Array.isArray(v) ? v : v.prompts);
        book.dirty = true; book.savedAt = Date.now(); storeBook();
        close(); toast(`Imported ${n} day(s)`); renderTop(); selectDay(selected, true);
      } catch (e) { toast('That file isn’t a Nichion backup.', 'error'); }
    });
    box.querySelector('[data-a="export"]').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ v: 1, exportedAt: new Date().toISOString(), days: book.days }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `nichion-prompts-${today()}.json`;
      document.body.append(a); a.click(); a.remove(); close();
    });
    box.querySelector('[data-a="pw"]').addEventListener('click', () => {
      const pw = prompt('New admin password (at least 4 characters):');
      if (pw == null) return;
      if (pw.length < 4) return toast('Too short — use at least 4 characters.', 'error');
      if (prompt('Type it again:') !== pw) return toast('Passwords didn’t match.', 'error');
      const salt = randomId();
      book.admin = { salt, hash: E.sha256(salt + '|' + pw) };
      book.dirty = true; storeBook();
      try { sessionStorage.setItem(SESSION_KEY, book.admin.hash); } catch {}
      close(); renderTop(); toast('Password changed — download the game file to keep it');
    });
    box.querySelector('[data-a="reset"]').addEventListener('click', () => {
      if (!confirm('Erase YOUR plays and streak in this browser? (Players are not affected.)')) return;
      try { localStorage.removeItem('nichion_save_v1'); } catch {}
      close(); toast('Your plays were reset — go back to the game to play again');
    });
    box.querySelector('[data-a="discard"]').addEventListener('click', () => {
      if (!confirm('Throw away every edit not yet downloaded, and reload prompts from this file?')) return;
      book = bookFromFile(); storeBook(); draft = null;
      close(); renderTop(); selectDay(selected, true);
    });
    box.querySelector('[data-a="logout"]').addEventListener('click', () => {
      try { sessionStorage.removeItem(SESSION_KEY); } catch {}
      close(); draft = null; renderLogin('Logged out.');
    });
  }

  // --------------------------------------------------------------- calendar
  function renderCalendar() {
    const cal = root.querySelector('.cal');
    const [y, m] = month.split('-').map(Number);
    const first = new Date(Date.UTC(y, m - 1, 1));
    const start = E.addDays(first.toISOString().slice(0, 10), -first.getUTCDay());
    const t = today();
    cal.innerHTML = '';
    const head = h(`<div class="cal-head">
      <button class="icon-btn" aria-label="Previous month" data-prev>◂</button>
      <b>${esc(first.toLocaleDateString(undefined, { month: 'long', year: 'numeric', timeZone: 'UTC' }).toUpperCase())}</b>
      <button class="icon-btn" aria-label="Next month" data-next>▸</button>
    </div>`);
    head.querySelector('[data-prev]').addEventListener('click', () => shiftMonth(-1));
    head.querySelector('[data-next]').addEventListener('click', () => shiftMonth(1));
    const grid = h('<div class="cal-grid"></div>');
    for (const d of ['S', 'M', 'T', 'W', 'T', 'F', 'S']) grid.append(h(`<div class="cal-dow">${d}</div>`));
    for (let i = 0; i < 42; i++) {
      const d = E.addDays(start, i);
      const n = count(d);
      const cls = ['cal-day'];
      if (d.slice(0, 7) !== month) cls.push('out');
      if (d < t) cls.push('past');
      if (d === t) cls.push('today');
      if (d === selected) cls.push('sel');
      if (n >= MAXP) cls.push('full');
      const dots = Array.from({ length: MAXP }, (_, k) => `<i class="${k < n ? '' : 'off'}"></i>`).join('');
      const b = h(`<button class="${cls.join(' ')}" aria-label="${esc(fmt(d))}: ${n} prompt${n === 1 ? '' : 's'}${d === t ? ' (today)' : ''}"><span>${+d.slice(8)}</span><span class="dots">${dots}</span></button>`);
      b.addEventListener('click', () => selectDay(d));
      grid.append(b);
    }
    cal.append(head, grid);
    const missing = [];
    for (let i = 0; i < 7; i++) { const d = E.addDays(t, i); if (!count(d)) missing.push(d); }
    cal.append(h(`<div class="cal-legend">
      <span><i style="background:var(--t-nichion)"></i>Full day (${MAXP} prompts)</span>
      <span><i style="background:var(--t-plankton)"></i>Some prompts set</span>
      <span><i style="box-shadow:inset 0 0 0 3px var(--accent)"></i>Today · days start at each player’s local midnight</span>
    </div>`));
    cal.append(h(`<div class="cal-upcoming"><h4>NEXT 7 DAYS</h4><p>${missing.length
      ? `<b>${missing.length}</b> day${missing.length === 1 ? '' : 's'} with no prompts: ${missing.map(d => esc(fmt(d, { month: 'short', day: 'numeric' }))).join(', ')}`
      : '<b class="ok">All set.</b> Every day this week has prompts.'}</p></div>`));
  }

  function shiftMonth(n) {
    const [y, m] = month.split('-').map(Number);
    month = new Date(Date.UTC(y, m - 1 + n, 1)).toISOString().slice(0, 7);
    renderCalendar();
  }

  function selectDay(d, force = false) {
    if (!force && d !== selected && dirty() && !confirm('You have unsaved changes on this day. Discard them?')) return;
    selected = d;
    month = d.slice(0, 7);
    renderCalendar();
    draft = (book.days[d] || []).map(p => ({
      text: p.text,
      answers: Object.fromEntries(tiers.map(t => [t.key, (p.answers[t.key] || []).join('\n')])),
    }));
    saved = JSON.stringify(draft);
    renderEditor();
  }

  // ----------------------------------------------------------------- editor
  const blankPrompt = () => ({ text: '', answers: Object.fromEntries(tiers.map(t => [t.key, ''])) });

  function renderEditor() {
    const ed = root.querySelector('#editor');
    ed.innerHTML = '';
    const t = today();
    const isToday = selected === t, isPast = selected < t;
    const head = h(`<div class="ed-head px-box">
      <div>
        <h2>${esc(fmt(selected).toUpperCase())}</h2>
        <div class="ed-meta">
          <span class="tag ${isToday ? 'live' : isPast ? 'past' : 'future'}">${isToday ? 'TODAY' : isPast ? 'PAST' : 'UPCOMING'}</span>
          <span>${draft.length}/${MAXP} prompts</span>
          <span class="tag dirty" data-dirty hidden>UNSAVED</span>
        </div>
      </div>
      <div class="ed-save">
        <button class="btn small ghost" data-revert>REVERT</button>
        <button class="btn small" data-save>SAVE DAY</button>
      </div>
    </div>`);
    head.querySelector('[data-save]').addEventListener('click', save);
    if (lastCleanup && lastCleanup.date !== selected) lastCleanup = null;
    head.querySelector('[data-revert]').addEventListener('click', () => { draft = JSON.parse(saved); renderEditor(); });
    ed.append(head);

    if (lastCleanup) {
      const note = h(`<div class="cleanup-note px-box dim" role="status">
        <div class="cleanup-head"><b>✂ CLEANED UP ${lastCleanup.items.length} DUPLICATE${lastCleanup.items.length === 1 ? '' : 'S'}</b><button class="icon-btn" aria-label="Dismiss">✕</button></div>
        <ul>${collapse(lastCleanup.items.map(it => `P${it.prompt + 1}\u0000${it.text}`)).map(x => { const [pp, rest] = x.split('\u0000'); return `<li><span>${pp}</span>${esc(rest)}</li>`; }).join('')}</ul>
      </div>`);
      note.querySelector('button').addEventListener('click', () => { lastCleanup = null; note.remove(); });
      ed.append(note);
    }
    if (isToday || isPast) {
      ed.append(h(`<div class="help px-box dim">${isToday
        ? '<b>This is today.</b> Players who already played keep their scores; changes only reach players once they open the new game file.'
        : 'This day is in the past. Players see it under “Yesterday’s depths” the day after it runs.'}</div>`));
    }
    if (!draft.length) {
      const e = h(`<div class="empty-day px-box"><div class="art"></div><p>No prompts for this day yet — players will see “the ocean is calm”.</p></div>`);
      e.querySelector('.art').append(Sprites.img('jelly', 5));
      ed.append(e);
    }
    draft.forEach((p, i) => ed.append(promptCard(p, i)));
    if (draft.length < MAXP) {
      const add = h(`<div class="add-row"><button class="btn blue" data-add>+ ADD PROMPT ${draft.length + 1}</button><button class="btn ghost" data-addtext>📝 PASTE AS TEXT</button></div>`);
      add.querySelector('[data-add]').addEventListener('click', () => {
        draft.push(blankPrompt());
        renderEditor();
        const cards = ed.querySelectorAll('.ptext');
        cards[cards.length - 1]?.focus();
      });
      add.querySelector('[data-addtext]').addEventListener('click', () => pasteTextModal(draft.length));
      ed.append(add);
    }
    ed.append(h(`<div class="help px-box dim">
      <b>How it works</b>
      <ul>
        <li>One answer per line. Extra accepted spellings go after a bar: <code>New York City | NYC | Big Apple</code>. Players see the first one.</li>
        <li>Capitals, punctuation, accents, “the/a/an” and simple plurals are ignored. Small typos are auto-corrected (none for 1–3 letters, 1 for 4–5, 2 for 6–9, 3 for 10+).</li>
        <li><b>📝 Paste as text:</b> question on the first line, a blank line, then answer groups deepest first (Nichion, Deep Cut, Rare, Schooler, Too Clever, Plankton), with a blank line between groups. Pasting that straight into a question box works too.</li>
        <li><b>Duplicates are cleaned up for you.</b> If the same answer (or a near-identical spelling, plural or typo) is in more than one tier, the deepest tier keeps it and the others are removed when you save.</li>
        <li><b>Descriptions:</b> add <code>*(…)</code> after a Nichion or Too Clever answer, like <code>cat *(feline friend)</code>. Players see it when they land that answer and on the next day’s answer sheet.</li>
        <li>Anything not listed scores 0. A day with fewer than ${MAXP} prompts still works; the score page notes “(out of N questions today)”.</li>
        <li><b>Save Day</b> keeps your edits in this browser. <b>Download game file</b> makes a new <code>nichion.html</code> with everything inside it; share that file.</li>
      </ul>
    </div>`));
    markDirty();
    renderSideLibrary();
  }

  function promptCard(p, i) {
    const card = h(`<article class="pcard px-box">
      <div class="pcard-head">
        <span class="num">PROMPT ${i + 1}</span>
        <div class="tools">
          <button class="icon-btn" data-up aria-label="Move up" ${i === 0 ? 'disabled' : ''}>▲</button>
          <button class="icon-btn" data-down aria-label="Move down" ${i === draft.length - 1 ? 'disabled' : ''}>▼</button>
          <button class="icon-btn" data-text aria-label="Paste prompt ${i + 1} as text">📝 TEXT</button>
          <button class="icon-btn" data-past aria-label="Paste a past prompt into prompt ${i + 1}">📋 PAST</button>
          <button class="icon-btn del" data-del aria-label="Delete prompt">✕ DELETE</button>
        </div>
      </div>
      <label class="sr-only" for="pt${i}">Prompt ${i + 1} text</label>
      <input class="field ptext" id="pt${i}" maxlength="200" placeholder="e.g. Name a fruit">
      <div class="dup-bar" data-dupbar hidden>
        <span>✂ <b data-dupcount></b> across the tiers — the copy in the deepest tier is kept, the rest are removed when you save.</span>
        <button class="btn small ghost" data-dupfix>REMOVE NOW</button>
      </div>
      <div class="tiers"></div>
      <div class="tester">
        <div class="kicker">TEST A GUESS</div>
        <input class="field" placeholder="Type a guess to see where it lands…" aria-label="Test a guess for prompt ${i + 1}">
        <div class="out" aria-live="polite"></div>
      </div>
    </article>`);
    const ptext = card.querySelector('.ptext');
    ptext.value = p.text;
    ptext.addEventListener('input', () => { p.text = ptext.value; markDirty(); });
    // Pasting a whole question block (question, blank line, answers…) fills the card.
    ptext.addEventListener('paste', e => {
      const raw = e.clipboardData && e.clipboardData.getData('text');
      if (!raw || !/\n\s*\n/.test(raw.trim())) return;
      e.preventDefault();
      const qs = E.parseQuestionText(raw);
      if (qs.length === 1 && !qs[0].warnings.length) applyParsed(qs, i);
      else pasteTextModal(i, raw);
    });
    card.querySelector('[data-past]').addEventListener('click', () => libraryModal(i));
    card.querySelector('[data-text]').addEventListener('click', () => pasteTextModal(i));
    card.querySelector('[data-dupfix]').addEventListener('click', () => removeDupesNow(i));
    card.querySelector('[data-up]').addEventListener('click', () => { [draft[i - 1], draft[i]] = [draft[i], draft[i - 1]]; renderEditor(); });
    card.querySelector('[data-down]').addEventListener('click', () => { [draft[i + 1], draft[i]] = [draft[i], draft[i + 1]]; renderEditor(); });
    card.querySelector('[data-del]').addEventListener('click', () => {
      const has = p.text || Object.values(p.answers).some(Boolean);
      if (has && !confirm(`Delete prompt ${i + 1}${p.text ? ` (“${p.text}”)` : ''}?`)) return;
      draft.splice(i, 1); renderEditor();
    });

    const tin = card.querySelector('.tester input'), out = card.querySelector('.tester .out');
    const runTest = () => {
      if (!tin.value.trim()) { out.textContent = ''; return; }
      const answers = Object.fromEntries(tiers.map(t => [t.key, lines(p.answers[t.key] || '')]));
      const m = E.matchGuess(tin.value, answers);
      if (!m) { out.style.removeProperty('--tc'); out.innerHTML = '🫧 <b>No catch</b> — 0 pts'; return; }
      const t = E.TIER_BY_KEY[m.tier];
      out.style.setProperty('--tc', `var(--t-${m.tier})`);
      out.innerHTML = `<b>${esc(t.name)}</b> · +${t.points} — matches “${esc(m.display)}”${m.corrected ? ` <i>(auto-corrected, ${m.distance} typo${m.distance === 1 ? '' : 's'})</i>` : ''}${m.desc ? `<br><span class="tester-desc">💬 ${esc(m.desc)}</span>` : ''}`;
    };
    tin.addEventListener('input', runTest);

    const tiersEl = card.querySelector('.tiers');
    for (const t of tiers) {
      const id = `ta${i}-${t.key}`;
      const box = h(`<div class="tbox" style="--tc:var(--t-${t.key})">
        <label for="${id}"><b>${esc(t.name.toUpperCase())}<br>${t.depth}M · ${t.points}PTS</b><small data-count></small></label>
        <textarea id="${id}" spellcheck="false" placeholder="${E.DESC_TIERS.includes(t.key) ? 'One answer per line&#10;cat *(feline friend) adds a description' : 'One answer per line'}"></textarea>
        <div class="warn" data-warn></div>
      </div>`);
      box.querySelector('label').prepend(Sprites.img(t.key, 2));
      const ta = box.querySelector('textarea');
      ta.value = p.answers[t.key] || '';
      const cnt = () => { const n = lines(ta.value).length; box.querySelector('[data-count]').textContent = n ? `${n} answer${n === 1 ? '' : 's'}` : 'empty'; };
      cnt();
      ta.addEventListener('input', () => { p.answers[t.key] = ta.value; cnt(); markDirty(); checkDupes(card, p, i); runTest(); });
      tiersEl.append(box);
    }
    checkDupes(card, p, i);
    return card;
  }

  // Live duplicate check for one prompt card: per-tier notes plus a bar with
  // a "remove now" button. Saving does the same cleanup automatically.
  function checkDupes(card, p, i) {
    const answers = Object.fromEntries(tiers.map(t => [t.key, lines(p.answers[t.key] || '')]));
    const { removed } = E.dedupeAnswers(answers);
    const warn = {};
    for (const r of removed) {
      (warn[r.tier] ||= []).push(r.tier === r.keptTier
        ? `“${r.spelling}” is listed twice`
        : `“${r.spelling}” ≈ “${r.keptAs}” in ${E.TIER_BY_KEY[r.keptTier].name}`);
    }
    for (const t of tiers) {
      const el = card.querySelector(`#ta${i}-${t.key}`)?.parentElement.querySelector('[data-warn]');
      let msg = warn[t.key] ? '✂ ' + collapse(warn[t.key]).join('; ') + ' — will be removed' : '';
      if (!E.DESC_TIERS.includes(t.key)) {
        const n = answers[t.key].filter(a => E.DESC_RE.test(a)).length;
        if (n) msg += (msg ? ' · ' : '') + `💬 ${n} description${n === 1 ? '' : 's'} here won’t be shown (only Nichion and Too Clever show them)`;
      }
      if (el) el.textContent = msg;
    }
    const bar = card.querySelector('[data-dupbar]');
    if (bar) {
      bar.hidden = !removed.length;
      bar.querySelector('[data-dupcount]').textContent = `${removed.length} duplicate${removed.length === 1 ? '' : 's'}`;
    }
  }

  /** ["a","a","b"] → ["a ×2","b"] */
  function collapse(list) {
    const counts = new Map();
    for (const x of list) counts.set(x, (counts.get(x) || 0) + 1);
    return [...counts].map(([x, n]) => (n > 1 ? `${x} ×${n}` : x));
  }

  function removeDupesNow(i) {
    const p = draft[i];
    const answers = Object.fromEntries(tiers.map(t => [t.key, lines(p.answers[t.key] || '')]));
    const { answers: clean, removed } = E.dedupeAnswers(answers);
    if (!removed.length) return;
    p.answers = Object.fromEntries(tiers.map(t => [t.key, clean[t.key].join('\n')]));
    renderEditor();
    const card = root.querySelectorAll('.pcard')[i];
    if (card) { card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 1200); }
    toast(`Removed ${removed.length} duplicate${removed.length === 1 ? '' : 's'} — kept the deepest copy`);
  }


  // ---------------------------------------------------------- past prompts
  // Every saved prompt from other days, searchable, ready to paste into the
  // day being edited.
  function libraryItems() {
    const t = today();
    const q = E.normalize(libQuery);
    const out = [];
    for (const [date, prompts] of Object.entries(book.days)) {
      if (date === selected) continue;
      if (libFilter === 'past' && date >= t) continue;
      if (libFilter === 'upcoming' && date < t) continue;
      prompts.forEach((p, idx) => {
        if (q) {
          const hay = E.normalize([p.text, ...tiers.flatMap(x => p.answers[x.key] || [])].join(' '));
          if (!hay.includes(q)) return;
        }
        out.push({ date, idx, p });
      });
    }
    return out.sort((a, b) => b.date.localeCompare(a.date) || a.idx - b.idx);
  }

  /** Builds the library UI. `target` = a prompt index to paste into, or null (sidebar). */
  function buildLibrary(target, onPasted) {
    const node = h(`<div class="lib-wrap">
      <div class="lib-head">
        <h3>PAST PROMPTS</h3>
        <span class="lib-count" data-count></span>
      </div>
      <input class="field lib-search" type="search" placeholder="Search prompts or answers…" aria-label="Search past prompts">
      <div class="lib-filters" role="radiogroup" aria-label="Which days">
        ${[['past', 'PAST'], ['upcoming', 'UPCOMING'], ['all', 'ALL']].map(([k, l]) => `<button class="lib-filter" role="radio" data-f="${k}">${l}</button>`).join('')}
      </div>
      <div class="lib-list" data-list></div>
    </div>`);
    const search = node.querySelector('.lib-search');
    search.value = libQuery;
    const list = node.querySelector('[data-list]');
    const paint = () => {
      node.querySelectorAll('.lib-filter').forEach(b => { const on = b.dataset.f === libFilter; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
      const items = libraryItems();
      node.querySelector('[data-count]').textContent = `${items.length}`;
      list.innerHTML = '';
      if (!items.length) {
        list.append(h(`<p class="lib-empty">${libQuery ? 'Nothing matches that search.' : libFilter === 'past' ? 'No past prompts yet — earlier days you fill in will show up here.' : 'No prompts here yet.'}</p>`));
        return;
      }
      for (const it of items.slice(0, 200)) list.append(libraryItem(it, target, onPasted));
    };
    let timer;
    search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { libQuery = search.value; paint(); }, 120); });
    node.querySelectorAll('.lib-filter').forEach(b => b.addEventListener('click', () => { libFilter = b.dataset.f; paint(); }));
    paint();
    return node;
  }

  function libraryItem({ date, idx, p }, target, onPasted) {
    const counts = tiers.map(t => (p.answers[t.key] || []).length);
    const total = counts.reduce((a, b) => a + b, 0);
    const item = h(`<details class="lib-item">
      <summary>
        <span class="lib-date">${esc(fmt(date, { month: 'short', day: 'numeric', year: date.slice(0, 4) === today().slice(0, 4) ? undefined : 'numeric' }).toUpperCase())} · P${idx + 1}</span>
        <span class="lib-text">${esc(p.text)}</span>
        <span class="lib-dots" title="${total} answers">${tiers.map((t, k) => `<i style="--tc:var(--t-${t.key})" class="${counts[k] ? '' : 'off'}"></i>`).join('')}</span>
      </summary>
      <div class="lib-body">
        <div class="lib-tiers"></div>
        <div class="lib-actions"></div>
      </div>
    </details>`);
    const tl = item.querySelector('.lib-tiers');
    for (const t of [...tiers].reverse()) {
      const ans = (p.answers[t.key] || []).map(E.parseAnswer).filter(Boolean)
        .map(a => (a.desc && E.DESC_TIERS.includes(t.key) ? `${a.display} (${a.desc})` : a.display));
      tl.append(h(`<div class="lib-tier" style="--tc:var(--t-${t.key})"><b>${esc(t.name.toUpperCase())}</b><span>${ans.length ? esc(ans.join(', ')) : '—'}</span></div>`));
    }
    const acts = item.querySelector('.lib-actions');
    const btn = (label, cls, fn) => { const b = h(`<button class="btn small ${cls}">${label}</button>`); b.addEventListener('click', fn); acts.append(b); };
    if (target != null) {
      btn(`PASTE INTO PROMPT ${target + 1}`, '', () => paste(p, target, date, onPasted));
    } else {
      draft.forEach((_, k) => btn(`INTO P${k + 1}`, 'ghost', () => paste(p, k, date, onPasted)));
      if (draft.length < MAXP) btn('+ NEW PROMPT', '', () => paste(p, draft.length, date, onPasted));
    }
    return item;
  }

  function paste(p, target, fromDate, onPasted) {
    const existing = draft[target];
    const hasContent = existing && (existing.text.trim() || Object.values(existing.answers).some(v => v.trim()));
    if (hasContent && !confirm(`Replace prompt ${target + 1}${existing.text ? ` (“${existing.text}”)` : ''} with “${p.text}”?`)) return;
    draft[target] = {
      text: p.text,
      answers: Object.fromEntries(tiers.map(t => [t.key, (p.answers[t.key] || []).join('\n')])),
    };
    onPasted && onPasted();
    renderEditor();
    const card = root.querySelectorAll('.pcard')[target];
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      card.classList.add('flash');
      setTimeout(() => card.classList.remove('flash'), 1200);
    }
    toast(`Pasted from ${fmt(fromDate, { month: 'short', day: 'numeric' })} — press Save Day to keep it`);
  }

  function renderSideLibrary() {
    const side = root.querySelector('.lib');
    if (!side) return;
    const keepFocus = document.activeElement && side.contains(document.activeElement) && document.activeElement.matches('.lib-search');
    const pos = keepFocus ? document.activeElement.selectionStart : null;
    const openKeys = [...side.querySelectorAll('.lib-item[open] .lib-date')].map(e => e.textContent);
    side.innerHTML = '';
    side.append(buildLibrary(null));
    side.querySelectorAll('.lib-item').forEach(d => { if (openKeys.includes(d.querySelector('.lib-date').textContent)) d.open = true; });
    if (keepFocus) { const s = side.querySelector('.lib-search'); s.focus(); s.setSelectionRange(pos, pos); }
  }

  function libraryModal(target) {
    const back = h(`<div class="modal-backdrop"><div class="modal px-box lib-modal" role="dialog" aria-modal="true" aria-label="Paste a past prompt">
      <button class="icon-btn close" aria-label="Close">✕</button>
    </div></div>`);
    const box = back.firstElementChild;
    const close = () => { back.remove(); document.removeEventListener('keydown', onEsc, true); };
    const onEsc = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
    box.append(h(`<p class="lib-intro">Pick a past prompt to copy into <b>prompt ${target + 1}</b>. Its text and every answer get pasted; you can edit them after.</p>`));
    box.append(buildLibrary(target, close));
    box.querySelector('.close').addEventListener('click', close);
    back.addEventListener('click', e => { if (e.target === back) close(); });
    document.addEventListener('keydown', onEsc, true);
    document.body.append(back);
    box.querySelector('.lib-search').focus();
  }

  // ------------------------------------------------------------ text paste
  const EXAMPLE = 'Name an animal\n\nfox\n\ncat\nmouse\nsnail\n\ndog\ncricket\nant';

  /** Put parsed questions into the day, starting at slot `start`. Returns false if cancelled. */
  function applyParsed(qs, start) {
    const room = MAXP - start;
    const use = qs.slice(0, Math.max(0, room));
    if (!use.length) { toast(`This day already has ${MAXP} prompts`, 'error'); return false; }
    const overwrite = use.map((_, k) => start + k).filter(k => {
      const d = draft[k];
      return d && (d.text.trim() || Object.values(d.answers).some(v => v.trim()));
    });
    if (overwrite.length && !confirm(`Replace prompt${overwrite.length === 1 ? '' : 's'} ${overwrite.map(k => k + 1).join(', ')} with the pasted text?`)) return false;
    use.forEach((q, k) => {
      draft[start + k] = { text: q.text, answers: Object.fromEntries(tiers.map(t => [t.key, q.answers[t.key].join('\n')])) };
    });
    renderEditor();
    const cards = root.querySelectorAll('.pcard');
    cards[start]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    use.forEach((_, k) => { const c = cards[start + k]; if (c) { c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 1200); } });
    toast(`Filled ${use.length} prompt${use.length === 1 ? '' : 's'} — press Save Day to keep ${use.length === 1 ? 'it' : 'them'}`);
    return true;
  }

  function pasteTextModal(start, initial = '') {
    const back = h(`<div class="modal-backdrop"><div class="modal px-box paste-modal" role="dialog" aria-modal="true" aria-labelledby="paste-h">
      <button class="icon-btn close" aria-label="Close">✕</button>
      <h2 id="paste-h">PASTE AS TEXT</h2>
      <div class="fmt">
        <pre class="fmt-example" aria-label="Example"></pre>
        <ul>
          <li><b>First line</b> is the question, then a <b>blank line</b>.</li>
          <li>Then answer groups, one answer per line, with a blank line between groups, <b>deepest first</b>:
            <span class="fmt-order">${E.TEXT_ORDER.map(k => `<i style="--tc:var(--t-${k})">${esc(E.TIER_BY_KEY[k].name)}</i>`).join('<span>→</span>')}</span></li>
          <li>Put <code>[]</code> on its own line for a tier with nothing in it. Stop early to leave the shallow tiers empty.</li>
          <li><code>cat *(feline friend)</code> adds a description, shown to players for <b>Nichion</b> and <b>Too Clever</b> answers.</li>
          <li><code>NYC | New York City</code> adds extra spellings. A <code>---</code> line starts another question.</li>
        </ul>
      </div>
      <label class="sr-only" for="paste-ta">Question text</label>
      <textarea id="paste-ta" class="paste-area" spellcheck="false" placeholder="Paste or type here…"></textarea>
      <div class="paste-preview" aria-live="polite"></div>
      <div class="paste-actions">
        <button class="btn ghost" data-example>USE EXAMPLE</button>
        <button class="btn" data-apply disabled>FILL</button>
      </div>
    </div></div>`);
    const box = back.firstElementChild;
    box.querySelector('.fmt-example').textContent = EXAMPLE;
    const ta = box.querySelector('textarea'), prev = box.querySelector('.paste-preview'), apply = box.querySelector('[data-apply]');
    let parsed = [];
    const close = () => { back.remove(); document.removeEventListener('keydown', onKey, true); };
    const onKey = e => {
      if (e.key === 'Escape') { e.stopPropagation(); close(); }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !apply.disabled) { e.preventDefault(); apply.click(); }
    };
    const paint = () => {
      parsed = E.parseQuestionText(ta.value).filter(q => q.text);
      prev.innerHTML = '';
      const room = MAXP - start;
      parsed.forEach((q, k) => {
        const slot = start + k;
        const fits = k < room;
        const card = h(`<div class="pv ${fits ? '' : 'off'}">
          <div class="pv-head"><span class="pv-slot">${fits ? (slot < draft.length ? `→ PROMPT ${slot + 1}` : `→ NEW PROMPT ${slot + 1}`) : 'WON’T FIT'}</span><b>${esc(q.text)}</b></div>
          <div class="pv-tiers"></div>
        </div>`);
        const tl = card.querySelector('.pv-tiers');
        for (const key of E.TEXT_ORDER) {
          const list = q.answers[key];
          const t = E.TIER_BY_KEY[key];
          const showDesc = E.DESC_TIERS.includes(key);
          tl.append(h(`<div class="pv-tier ${list.length ? '' : 'empty'}" style="--tc:var(--t-${key})"><b>${esc(t.name.toUpperCase())}</b><span>${list.length ? list.map(a => { const pa = E.parseAnswer(a); return `<em>${esc(pa?.display || a)}${pa?.desc && showDesc ? `<small>${esc(pa.desc)}</small>` : ''}</em>`; }).join('') : '—'}</span></div>`));
        }
        for (const w of q.warnings) card.append(h(`<p class="pv-warn">⚠ ${esc(w)}</p>`));
        for (const n of q.notes || []) card.append(h(`<p class="pv-note">✂ ${esc(n)}</p>`));
        prev.append(card);
      });
      if (parsed.length > room) prev.append(h(`<p class="pv-warn">⚠ A day holds ${MAXP} prompts — only the first ${Math.max(0, room)} will be used.</p>`));
      const n = Math.min(parsed.length, Math.max(0, room));
      apply.disabled = !n;
      apply.textContent = !n ? 'FILL' : n === 1 ? (start < draft.length ? `FILL PROMPT ${start + 1}` : 'ADD AS NEW PROMPT') : `FILL PROMPTS ${start + 1}–${start + n}`;
    };
    ta.addEventListener('input', paint);
    box.querySelector('[data-example]').addEventListener('click', () => { ta.value = EXAMPLE; paint(); ta.focus(); });
    apply.addEventListener('click', () => { if (applyParsed(parsed, start)) close(); });
    box.querySelector('.close').addEventListener('click', close);
    back.addEventListener('click', e => { if (e.target === back) close(); });
    document.addEventListener('keydown', onKey, true);
    document.body.append(back);
    // Pre-fill with what's already in that slot, so it can be edited as text too.
    ta.value = initial || (draft[start] && draft[start].text ? E.promptToText({ text: draft[start].text, answers: Object.fromEntries(tiers.map(t => [t.key, lines(draft[start].answers[t.key] || '')])) }) : '');
    paint();
    ta.focus();
  }

  function markDirty() {
    const tag = root.querySelector('[data-dirty]');
    if (tag) tag.hidden = !dirty();
  }

  let lastCleanup = null;   // { date, items: [{ prompt, text }] } shown after a save

  function save() {
    const prompts = draft.map(p => ({
      text: p.text.trim(),
      answers: Object.fromEntries(tiers.map(t => [t.key, lines(p.answers[t.key] || '')])),
    }));
    const missingText = prompts.findIndex(p => !p.text && tiers.some(t => p.answers[t.key].length));
    if (missingText >= 0) { toast(`Prompt ${missingText + 1} needs text`, 'error'); root.querySelector('#pt' + missingText)?.focus(); return; }
    const noAnswers = prompts.findIndex(p => p.text && !tiers.some(t => p.answers[t.key].length));
    if (noAnswers >= 0 && !confirm(`Prompt ${noAnswers + 1} has no answers — every guess would score 0. Save anyway?`)) return;
    // Duplicates / near-duplicates: keep the deepest copy, drop the rest.
    const items = [];
    prompts.forEach((p, k) => {
      const { answers, removed } = E.dedupeAnswers(p.answers);
      p.answers = answers;
      for (const r of removed) items.push({ prompt: k, text: E.describeRemoval(r) });
    });
    const clean = E.cleanPrompts(prompts);
    if (clean.length) book.days[selected] = clean; else delete book.days[selected];
    book.dirty = true; book.savedAt = Date.now();
    storeBook();
    lastCleanup = items.length ? { date: selected, items } : null;
    toast(items.length
      ? `Saved — removed ${items.length} duplicate${items.length === 1 ? '' : 's'} (kept the deepest)`
      : 'Saved ✓ — download the game file when you’re done');
    selectDay(selected, true);
    renderTop();
  }


  function onKey(e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && draft && root.isConnected) { e.preventDefault(); save(); }
  }
  function onUnload(e) { if (dirty() || book?.dirty) { e.preventDefault(); e.returnValue = ''; } }

  function exit() {
    if (dirty() && !confirm('Leave without saving this day?')) return;
    document.removeEventListener('keydown', onKey);
    removeEventListener('beforeunload', onUnload);
    root.remove();
    document.body.classList.remove('admin-open');
    if (location.hash === '#admin') history.replaceState(null, '', location.pathname + location.search);
    onExit && onExit();
  }

  /** Open the admin panel over the game. */
  async function open(opts) {
    DATA = opts.data; PRISTINE = opts.pristine; onExit = opts.onExit;
    root = document.createElement('div');
    root.id = 'admin-root';
    document.body.append(root);
    document.body.classList.add('admin-open');
    document.addEventListener('keydown', onKey);
    addEventListener('beforeunload', onUnload);
    await chooseBook();
    if (loggedIn()) renderShell(); else renderLogin();
  }

  window.NichionAdmin = { open };
})();

document.addEventListener('DOMContentLoaded', function () {
  'use strict';

  // The untouched page source, captured before anything changes the DOM, so
  // the admin can download a copy of this file with new prompts inside.
  const PRISTINE = '<!doctype html>\n' + document.documentElement.outerHTML;

  // ------------------------------------------------------------------ setup
  const E = window.NichionEngine;
  const DATA = JSON.parse(document.getElementById('nichion-data').textContent);
  const game = new E.Game(DATA, E.makeStorage('nichion_save_v1'));
  const $ = (s, r = document) => r.querySelector(s);
  const screenEl = $('#screen');
  const ocean = new Ocean($('#ocean'));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const EMOJI = { plankton: '🦠', clever: '🐙', schooler: '🐟', rare: '🐢', deepcut: '🏮', nichion: '🦁', miss: '⌛' };
  const BLURB = {
    plankton: 'Everyone thought of it.',
    clever: 'A little too obvious-clever.',
    schooler: 'Swimming with the pack.',
    rare: 'Not many go this deep.',
    deepcut: 'A true deep cut.',
    nichion: 'You found the Nichion!',
  };

  let S = null;          // game state
  let tiers = [], tierBy = {};
  let resetAt = 0;
  let busy = false;
  let view = 'title';

  function load() {
    S = game.state();
    tiers = S.tiers;
    tierBy = Object.fromEntries(tiers.map(t => [t.key, t]));
    resetAt = Date.now() + S.resetInMs;
    return S;
  }

  const depthSoFar = () => S.play.guesses.reduce((s, g) => s + g.depth, 0);
  const tierColor = k => `var(--t-${k || 'miss'})`;
  const fmtDate = (d, opts = { weekday: 'long', month: 'short', day: 'numeric' }) =>
    new Date(d + 'T12:00:00Z').toLocaleDateString(undefined, { ...opts, timeZone: 'UTC' });

  // ---------------------------------------------------------- screen system
  function show(node, name) {
    view = name;
    stopTimer();
    hideTip();
    const olds = [...screenEl.children];
    for (const old of olds) {
      if (!old.classList.contains('leaving')) { old.classList.add('leaving'); setTimeout(() => old.remove(), 200); }
    }
    if (olds.length) node.style.animationDelay = '120ms';
    screenEl.appendChild(node);
    $('#topbar').classList.toggle('hide-logo', name === 'title');
    $('#depth-gauge').classList.toggle('show', name === 'game');
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }

  function toast(msg, kind = '') {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'show ' + kind;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.className = kind; }, 2600);
  }

  // ---------------------------------------------------------------- tooltip
  const tip = $('#tip');
  function showTip(target) {
    tip.innerHTML = target.getAttribute('data-tip');
    tip.hidden = false;
    const r = target.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = r.left + r.width / 2 - tw / 2;
    x = Math.max(10, Math.min(innerWidth - tw - 10, x));
    let y = r.top - th - 12;
    if (y < 8) y = r.bottom + 12;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
    document.querySelectorAll('.chart g.on').forEach(g => g.classList.remove('on'));
    if (target.matches('.chart g')) target.classList.add('on');
  }
  function hideTip() { tip.hidden = true; document.querySelectorAll('.chart g.on').forEach(g => g.classList.remove('on')); }
  document.addEventListener('pointerover', e => { const t = e.target.closest('[data-tip]'); if (t) showTip(t); });
  document.addEventListener('pointerout', e => { const t = e.target.closest('[data-tip]'); if (t && !t.contains(e.relatedTarget)) hideTip(); });
  document.addEventListener('focusin', e => { const t = e.target.closest('[data-tip]'); if (t && t.matches(':focus-visible')) showTip(t); });
  document.addEventListener('focusout', hideTip);
  addEventListener('scroll', hideTip, { passive: true });

  // ------------------------------------------------------------------ modal
  function modal(inner, { onClose } = {}) {
    const root = $('#modal-root');
    const back = h(`<div class="modal-backdrop"><div class="modal px-box" role="dialog" aria-modal="true">
      <button class="icon-btn close" aria-label="Close"><svg viewBox="0 0 12 12" width="18" height="18" shape-rendering="crispEdges"><path fill="currentColor" d="M1 1h2v1h1v1h1v1h2V3h1V2h1V1h2v2h-1v1H9v1H8v2h1v1h1v1h1v2H9v-1H8v-1H7V9H5v1H4v1H3v1H1v-2h1V9h1V8h1V6H3V5H2V4H1z"/></svg></button>
    </div></div>`);
    const box = back.firstElementChild;
    box.append(inner);
    const prevFocus = document.activeElement;
    const close = () => {
      back.classList.add('closing');
      document.removeEventListener('keydown', onKey);
      setTimeout(() => { back.remove(); prevFocus?.focus?.(); onClose?.(); }, 150);
    };
    const onKey = e => { if (e.key === 'Escape') close(); };
    back.addEventListener('click', e => { if (e.target === back) close(); });
    box.querySelector('.close').addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    root.append(back);
    (box.querySelector('[data-autofocus]') || box.querySelector('.close')).focus();
    return close;
  }

  function helpModal() {
    const node = h(`<div>
      <h2>HOW TO DIVE</h2>
      <p>Every day there are up to <b>five prompts</b>, and you get <b>25 seconds</b> for each.</p>
      <p>Type answers until you hit one that’s on the board. Common answers keep you in the shallows; <b>rarer answers sink you deeper</b> and score more. Run out of time and you stay put.</p>
      <div class="tier-legend" style="margin:16px 0"></div>
      <p>Small typos are forgiven — the sonar auto-corrects answers that are close.</p>
      <p>Come back tomorrow to see <b>yesterday’s full answer sheet</b>, and keep your streak alive.</p>
      <button class="btn wide" data-autofocus>GOT IT</button>
      <button class="admin-link" data-admin>Admin: edit prompts</button>
    </div>`);
    node.querySelector('.tier-legend').append(...tierLegend());
    const close = modal(node);
    node.querySelector('.btn').addEventListener('click', close);
    node.querySelector('[data-admin]').addEventListener('click', () => { close(); setTimeout(openAdmin, 180); });
  }

  function noPromptsModal() {
    const node = h(`<div class="calm">
      <div class="art"></div>
      <h2>THE OCEAN IS CALM</h2>
      <p>No prompts have been set for today, so there’s no dive.</p>
      <p>Check back tomorrow${S.hasYesterday ? ' — or look over yesterday’s answers' : ''}.</p>
      <div class="title-actions">
        ${S.hasYesterday ? '<button class="btn blue wide" data-y>YESTERDAY</button>' : ''}
        <button class="btn wide" data-autofocus data-ok>OKAY</button>
      </div>
    </div>`);
    node.querySelector('.art').append(Sprites.img('jelly', 6));
    const close = modal(node);
    node.querySelector('[data-ok]').addEventListener('click', close);
    node.querySelector('[data-y]')?.addEventListener('click', () => { close(); renderYesterday(); });
  }

  function tierLegend() {
    return tiers.map(t => {
      const c = h(`<div class="tier-chip" style="--tc:${tierColor(t.key)}"><span class="tn">${esc(t.name)}</span><span class="td">${t.depth}M · ${t.points}PTS</span></div>`);
      c.prepend(Sprites.img(t.key, 3));
      return c;
    });
  }

  /** "Come back tomorrow" card: today's full answer sheet unlocks at midnight. */
  function comeBackCard(compact = false) {
    const p = S.play;
    const gotTop = p.guesses.some(g => g.tier === 'nichion');
    const line = gotTop
      ? 'You found a Nichion today. Come back tomorrow to see the rest of the best guesses: every Nichion and Deep Cut answer, revealed.'
      : 'Come back tomorrow to see today’s best guesses: every Nichion and Deep Cut answer, plus the whole board, revealed.';
    const card = h(`<div class="comeback ${compact ? 'compact' : ''}">
      <div class="comeback-art"></div>
      <div>
        <div class="comeback-title">COME BACK TOMORROW</div>
        <p>${compact ? 'See today’s best guesses when the answers unlock.' : line}</p>
        <div class="comeback-time">Unlocks in <b data-cd>--:--:--</b></div>
      </div>
    </div>`);
    card.querySelector('.comeback-art').append(Sprites.img('nichion', compact ? 2 : 3));
    return card;
  }

  function statsRow() {
    const st = S.stats;
    return h(`<div class="stats">
      <div class="stat hot"><b>${st.streak}</b><span>Streak</span></div>
      <div class="stat"><b>${st.bestStreak}</b><span>Best streak</span></div>
      <div class="stat"><b>${st.played}</b><span>Dives</span></div>
      <div class="stat"><b>${st.bestScore}</b><span>Best score</span></div>
    </div>`);
  }

  // ------------------------------------------------------------------ title
  function renderTitle() {
    ocean.setMode('surface');
    const p = S.play;
    const letters = 'NICHION'.split('').map((c, i) => `<span style="animation-delay:${-i * 0.14}s">${c}</span>`).join('');
    let status = '';
    if (S.clockProblem) status = `Your device’s date looks earlier than a day you already played (${esc(fmtDate(S.clockProblem, { month: 'short', day: 'numeric' }))}). Fix the clock to dive.`;
    else if (!p.total) status = 'No prompts today — the water’s still.';
    else if (p.done) status = `Today’s dive is done: <b>${p.score} pts</b>.`;
    else if (p.guesses.length) status = `Dive in progress — prompt <b>${p.current + 1}</b> of ${p.total}.`;
    else status = `<b>${p.total}</b> prompt${p.total === 1 ? '' : 's'} today · 25 seconds each.`;

    const node = h(`<section class="screen title">
      <h1 class="logo" aria-label="Nichion">${letters}</h1>
      <p class="tagline">How deep can you go?</p>
      <div class="title-date">${esc(fmtDate(S.today).toUpperCase())}</div>
      <div class="title-spacer"></div>
      <div class="title-panel px-box">
        <p class="title-status">${status}</p>
        <div class="title-actions">
          <button class="btn wide" data-play>${p.done ? 'SEE RESULTS' : p.guesses.length ? 'RESUME DIVE' : 'DIVE IN'} <span class="arrow">▸</span></button>
          <button class="btn blue wide" data-y>YESTERDAY’S DEPTHS</button>
        </div>
        <div></div>
      </div>
    </section>`);
    node.querySelector('.title-panel > div:last-child').replaceWith(statsRow());
    if (p.done) { node.querySelector('.title-actions').after(comeBackCard(true)); }
    if (!S.persistent) node.querySelector('.title-status').after(h('<p class="warn-line">This browser isn’t saving progress (private mode?). Your streak won’t be kept.</p>'));
    node.querySelector('[data-play]').addEventListener('click', () => {
      load();
      if (S.clockProblem) return toast('Your device clock looks wrong — set it to today’s date.', 'error');
      if (!S.play.total) return noPromptsModal();
      if (S.play.done) return renderResults();
      renderGame();
    });
    node.querySelector('[data-y]').addEventListener('click', renderYesterday);
    show(node, 'title');
    if (p.done) startCountdown(node);
  }

  // ------------------------------------------------------------------- game
  function hud() {
    const p = S.play;
    const node = h(`<div class="hud px-box dim">
      <div class="hud-side">DEPTH<b data-depth>${depthSoFar()}m</b></div>
      <div class="pips-wrap">
        <div class="pips" role="list" aria-label="Prompts"></div>
        <div class="pip-label" data-pl></div>
      </div>
      <div class="hud-side right">SCORE<b data-score>${p.score}</b></div>
    </div>`);
    updateHud(node);
    return node;
  }

  function updateHud(node, { pop = -1 } = {}) {
    const p = S.play;
    const pips = node.querySelector('.pips');
    pips.innerHTML = '';
    for (let i = 0; i < p.total; i++) {
      const g = p.guesses[i];
      const pip = h(`<div class="pip" role="listitem"></div>`);
      if (g) {
        pip.classList.add('done');
        if (!g.tier) pip.classList.add('miss');
        pip.style.setProperty('--tc', tierColor(g.tier));
        pip.setAttribute('aria-label', `Prompt ${i + 1}: ${g.tier ? tierBy[g.tier].name : 'time ran out'}`);
        pip.dataset.tip = g.tier ? `<b>P${i + 1}</b> “${esc(g.guess)}” · ${esc(tierBy[g.tier].name)}` : `<b>P${i + 1}</b> Time ran out`;
        if (i === pop) pip.classList.add('pop');
      } else {
        if (i === p.current) pip.classList.add('current');
        pip.setAttribute('aria-label', `Prompt ${i + 1}${i === p.current ? ' (current)' : ''}`);
      }
      pips.append(pip);
    }
    const on = p.current == null ? p.total : p.current + 1;
    node.querySelector('[data-pl]').textContent = `PROMPT ${Math.min(on, p.total)} OF ${p.total}`;
    updateGauge();
  }

  function updateGauge() {
    const g = $('#depth-gauge');
    const max = Math.max(100, S.play.total * 100);
    const d = depthSoFar();
    if (!g.dataset.built || +g.dataset.max !== max) {
      g.innerHTML = '<div class="fill"></div>';
      for (let m = 0; m <= max; m += 100) g.append(h(`<div class="tick" style="top:${(m / max) * 100}%">${m}m</div>`));
      g.append(h('<div class="marker"><span></span></div>'));
      g.dataset.built = 1; g.dataset.max = max;
    }
    g.querySelector('.fill').style.height = (d / max) * 100 + '%';
    const mk = g.querySelector('.marker');
    mk.style.top = `calc(${(d / max) * 100}% - 2px)`;
    mk.querySelector('span').textContent = d + 'm';
  }

  function bump(el, text) {
    el.textContent = text;
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }

  function renderGame() {
    const p = S.play;
    if (!p.total) return noPromptsModal();
    if (p.done) return renderResults();
    ocean.setMode('dive');
    ocean.setDepth(depthSoFar(), { burst: false });

    const node = h(`<section class="screen game"></section>`);
    const hudEl = hud();
    node.append(hudEl, h('<div class="window"></div>'));
    const card = h(`<section class="card px-box"></section>`);
    node.append(card);
    show(node, 'game');
    promptCard(card, hudEl);
  }

  let timerId = 0;
  const stopTimer = () => { clearInterval(timerId); timerId = 0; };

  function promptCard(card, hudEl) {
    stopTimer();
    const p = S.play;
    const i = p.current;
    const prompt = p.prompts[i];
    let deadline;
    try { deadline = game.start({ date: S.today, index: i }); }
    catch (err) { load(); return err.code === 'out_of_order' ? renderGame() : renderTitle(); }
    const LIMIT = E.TIME_LIMIT_MS;

    card.innerHTML = '';
    card.append(h(`<div>
      <div class="kicker"><span>PROMPT ${i + 1} / ${p.total}</span><span class="timer-num" data-num aria-hidden="true">25</span></div>
      <div class="timer" role="timer" aria-label="Time left"><i data-bar></i></div>
      <h2 class="prompt-text" id="prompt-text">${esc(prompt.text)}</h2>
      <form class="guess-form" autocomplete="off" novalidate>
        <label class="sr-only" for="guess">Your answer</label>
        <input class="field" id="guess" name="guess" maxlength="60" placeholder="Your answer…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-describedby="prompt-text nope">
        <button class="btn" type="submit">DIVE</button>
      </form>
      <div class="tries" data-tries>
        <p class="nope" id="nope" role="status" aria-live="assertive"></p>
        <div class="miss-chips" data-chips></div>
      </div>
      <p class="hint"><span>Not on the board? Keep trying until time runs out.</span><span><kbd>ENTER</kbd></span></p>
    </div>`));
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = 'screen-in 380ms both';
    const form = card.querySelector('form');
    const input = card.querySelector('input');
    const btn = form.querySelector('button');
    const bar = card.querySelector('[data-bar]'), num = card.querySelector('[data-num]'), timerEl = card.querySelector('.timer');
    const nope = card.querySelector('.nope'), chips = card.querySelector('[data-chips]');
    const renderChips = list => { chips.innerHTML = ''; list.forEach(m => chips.append(h(`<span class="miss-chip">✗ ${esc(m)}</span>`))); };
    renderChips(p.misses || []);
    setTimeout(() => input.focus({ preventScroll: true }), 60);

    // Countdown (wall-clock based, so reloading or switching tabs doesn't pause it).
    let lastSec = null;
    const tick = () => {
      const left = Math.max(0, deadline - Date.now());
      bar.style.width = (left / LIMIT) * 100 + '%';
      const sec = Math.ceil(left / 1000);
      if (sec !== lastSec) {
        num.textContent = sec;
        lastSec = sec;
        timerEl.classList.toggle('low', sec <= 5);
        num.classList.toggle('low', sec <= 5);
        if (sec <= 5 && sec > 0) { num.classList.remove('tick'); void num.offsetWidth; num.classList.add('tick'); }
      }
      if (left <= 0) {
        stopTimer();
        try {
          const rec = game.timeUp({ date: S.today, index: i });
          load();
          revealResult(card, hudEl, rec);
        } catch (err) {
          if (err.code === 'not_yet') { timerId = setInterval(tick, 100); return; }
          load(); renderGame();
        }
      }
    };
    tick();
    timerId = setInterval(tick, 100);

    const shake = () => { input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); };
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (busy || !timerId) return;
      const guess = input.value.trim();
      if (!guess) { shake(); input.focus(); return; }
      busy = true;
      try {
        const result = game.guess({ date: S.today, index: i, guess });
        if (result.invalid) {
          shake();
          nope.textContent = result.repeat ? `You already tried “${result.guess}”.` : `“${result.guess}” isn’t on the board — try again!`;
          nope.classList.remove('show'); void nope.offsetWidth; nope.classList.add('show');
          renderChips(result.misses);
          input.value = '';
          input.focus();
          return;
        }
        stopTimer();
        load();
        revealResult(card, hudEl, result);
      } catch (err) {
        stopTimer();
        if (err.code === 'day_changed') { toast('A new day has begun — reloading…'); await sleep(900); load(); return renderTitle(); }
        if (err.code === 'clock') { load(); return renderTitle(); }
        if (err.code === 'out_of_order' || err.code === 'done') { load(); return renderGame(); }
        toast(err.message, 'error');
        timerId = setInterval(tick, 100);
        input.focus();
      } finally { busy = false; }
    });
  }

  function revealResult(card, hudEl, r) {
    const p = S.play;
    const t = r.tier ? tierBy[r.tier] : null;
    const last = p.done;
    const form = card.querySelector('form');
    const hint = card.querySelector('.hint');
    card.querySelector('[data-tries]')?.remove();
    const timer = card.querySelector('.timer');
    if (timer) { timer.classList.add('done'); if (r.timedOut) timer.querySelector('i').style.width = '0%'; }
    const tries = r.misses && r.misses.length ? `<div class="result-tries">${r.misses.length} miss${r.misses.length === 1 ? '' : 'es'} first: ${r.misses.slice(0, 4).map(esc).join(', ')}${r.misses.length > 4 ? '…' : ''}</div>` : '';
    const res = h(`<div class="result ${t ? '' : 'miss'} ${r.tier === 'nichion' ? 'big' : ''}" style="--tc:${tierColor(r.tier)}">
      <div class="result-art"></div>
      <div>
        <div class="result-tier">${t ? esc(t.name).toUpperCase() : 'TIME’S UP'}</div>
        <div class="result-gain">${t ? `<span class="pts">+${t.points} PTS</span><span>↓ ${t.depth}M</span>` : '<span>+0 PTS</span><span>STAY PUT</span>'}</div>
        <div class="result-guess">${t ? `${esc(BLURB[r.tier])}<br><q>${esc(r.matched)}</q>` : 'The clock ran out before you found an answer.'}</div>
        ${r.desc ? `<div class="result-desc">${esc(r.desc)}</div>` : ''}
        ${tries}
        ${r.corrected ? `<div class="autocorrect" title="Close enough!">✎ auto-corrected from “${esc(r.guess)}”</div>` : ''}
      </div>
      <div class="result-actions"><button class="btn wide" data-next>${last ? 'SEE RESULTS' : 'NEXT PROMPT'} <span class="arrow">▸</span></button></div>
    </div>`);
    res.querySelector('.result-art').append(t ? Sprites.img(r.tier, r.tier === 'nichion' ? 4 : r.tier === 'plankton' || r.tier === 'schooler' ? 6 : 5) : Sprites.img('hourglass', 6));
    form.replaceWith(res);
    hint.remove();

    // Dive!
    ocean.setDepth(depthSoFar());
    if (r.tier === 'nichion') { ocean.celebrate('#ffcf3f'); const f = h('<div class="flash"></div>'); document.body.append(f); setTimeout(() => f.remove(), 800); }
    else if (r.tier === 'deepcut') ocean.celebrate('#fff3a0');
    bump(hudEl.querySelector('[data-depth]'), depthSoFar() + 'm');
    bump(hudEl.querySelector('[data-score]'), p.score);
    updateHud(hudEl, { pop: r.index });

    const next = res.querySelector('[data-next]');
    setTimeout(() => next.focus({ preventScroll: true }), 50);
    next.addEventListener('click', () => {
      if (last) return renderResults();
      promptCard(card, hudEl);
      updateHud(hudEl);
    });
  }

  // ---------------------------------------------------------------- results
  const RANKS = [
    [0, 'Puddle Paddler'], [0.15, 'Reef Wader'], [0.3, 'Kelp Climber'],
    [0.45, 'Trench Diver'], [0.6, 'Abyss Walker'], [0.75, 'Leviathan Hunter'], [0.9, 'Nichion Tamer'],
  ];

  function renderResults() {
    const p = S.play;
    ocean.setMode('dive');
    ocean.setDepth(depthSoFar(), { burst: false });
    const max = p.total * 100;
    const frac = max ? p.score / max : 0;
    const rank = RANKS.filter(([f]) => frac >= f).pop()[1];

    const node = h(`<section class="screen results">
      <div class="score-panel px-box">
        <div class="kicker">DIVE COMPLETE · ${esc(fmtDate(S.today, { month: 'short', day: 'numeric' }).toUpperCase())}</div>
        <div class="rank">${esc(rank)}</div>
        <div class="big-score"><span data-count>0</span><small>PTS</small></div>
        <div class="score-sub">↓ ${depthSoFar()}M DEEP · MAX ${max}</div>
        ${p.total < 5 ? `<p class="footnote">(out of ${p.total} question${p.total === 1 ? '' : 's'} today)</p>` : ''}
        <div class="share-row">
          <button class="btn small" data-share>SHARE</button>
          <button class="btn small blue" data-y>YESTERDAY</button>
        </div>
        <div class="countdown">Next dive in<b data-cd>--:--:--</b></div>
      </div>
      <div class="section px-box"></div>
      <div class="section px-box">
        <h3>POINTS PER PROMPT</h3><p class="sub">Each guess, by how rare it was.</p>
        <div data-bars></div>
      </div>
      <div class="section px-box">
        <h3>DIVE PROFILE</h3><p class="sub">Your depth after each prompt.</p>
        <div data-profile></div>
      </div>
      <div class="section px-box">
        <h3>YOUR GUESSES</h3><p class="sub">What you said, and where it landed.</p>
        <ul class="guess-list"></ul>
      </div>
    </section>`);

    const statsSec = node.querySelectorAll('.section')[0];
    statsSec.append(h('<h3 style="margin-bottom:12px">YOUR STATS</h3>'), statsRow(), comeBackCard());

    node.querySelector('[data-bars]').append(Charts.bars(p.guesses, p.total, tiers));
    node.querySelector('[data-profile]').append(Charts.profile(p.guesses, p.total, tiers));

    const list = node.querySelector('.guess-list');
    p.guesses.forEach((g, i) => {
      const t = tierBy[g.tier];
      const row = h(`<li class="guess-row" style="--tc:${tierColor(g.tier)};animation-delay:${200 + i * 80}ms">
        <div></div>
        <div><div class="q">P${i + 1} · ${esc(g.prompt)}</div><div class="a">${g.timedOut ? '<span class="muted">Time ran out</span>' : esc(g.guess)}${g.corrected && g.matched ? ` <small>→ ${esc(g.matched)}</small>` : ''}</div>${g.desc ? `<div class="desc">${esc(g.desc)}</div>` : ''}${g.misses && g.misses.length ? `<div class="q">${g.misses.length} miss${g.misses.length === 1 ? '' : 'es'} first</div>` : ''}</div>
        <div class="p">+${g.points}<small>${t ? esc(t.name).toUpperCase() : 'TIME’S UP'}</small></div>
      </li>`);
      row.firstElementChild.replaceWith(Sprites.img(t ? g.tier : 'hourglass', 3));
      list.append(row);
    });

    node.querySelector('[data-share]').addEventListener('click', share);
    node.querySelector('[data-y]').addEventListener('click', renderYesterday);
    show(node, 'results');

    // Count-up.
    const el = node.querySelector('[data-count]');
    const start = performance.now(), dur = Math.min(1600, 400 + p.score * 4);
    const tick = now => {
      const f = Math.min(1, (now - start) / dur);
      el.textContent = Math.round(p.score * (1 - Math.pow(1 - f, 3)));
      if (f < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    startCountdown(node);
  }

  /** Ticks every [data-cd] inside `scope` down to the next local midnight. */
  function startCountdown(scope) {
    clearInterval(startCountdown._i);
    const els = [...scope.querySelectorAll('[data-cd]')];
    const upd = async () => {
      if (!scope.isConnected) return clearInterval(startCountdown._i);
      const ms = resetAt - Date.now();
      if (ms <= 0) {
        clearInterval(startCountdown._i);
        load();
        toast('A new dive is ready!');
        return renderTitle();
      }
      const s = Math.floor(ms / 1000);
      const txt = [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(n => String(n).padStart(2, '0')).join(':');
      els.forEach(el => { el.textContent = txt; });
    };
    upd();
    startCountdown._i = setInterval(upd, 1000);
  }

  async function share() {
    const p = S.play;
    const text = [
      `NICHION · ${fmtDate(S.today, { month: 'short', day: 'numeric' })}`,
      p.guesses.map(g => EMOJI[g.tier || 'miss']).join(''),
      `↓${depthSoFar()}m · ${p.score} pts${p.total < 5 ? ` (out of ${p.total})` : ''}`,
      location.origin,
    ].join('\n');
    try {
      if (navigator.share && matchMedia('(pointer: coarse)').matches) await navigator.share({ text });
      else { await navigator.clipboard.writeText(text); toast('Copied to clipboard!'); }
    } catch (e) {
      if (e?.name !== 'AbortError') toast('Couldn’t copy — try again.', 'error');
    }
  }

  // -------------------------------------------------------------- yesterday
  async function renderYesterday() {
    const loading = h('<section class="screen"><div class="loading">SONAR<span>…</span></div></section>');
    show(loading, 'yesterday');
    await sleep(250);
    if (view !== 'yesterday') return;
    const Y = game.yesterday();

    const node = h(`<section class="screen yesterday">
      <div class="y-head px-box">
        <div class="kicker">YESTERDAY’S DEPTHS</div>
        <h2>${esc(fmtDate(Y.date).toUpperCase())}</h2>
        <button class="btn small ghost" data-back>◂ BACK</button>
      </div>
    </section>`);
    node.querySelector('[data-back]').addEventListener('click', () => (S.play.done ? renderResults() : renderTitle()));

    if (!Y.prompts.length) {
      const empty = h(`<div class="section px-box calm"><div class="art"></div><p class="empty">No prompts were set yesterday.</p></div>`);
      empty.querySelector('.art').append(Sprites.img('jelly', 5));
      node.append(empty);
    }

    for (const pr of Y.prompts) {
      const g = Y.guesses.find(x => x.index === pr.index);
      const gt = g?.tier ? tierBy[g.tier] : null;
      const sec = h(`<div class="section px-box y-prompt" style="--tc:${tierColor(g?.tier)}">
        <div class="kicker">PROMPT ${pr.index + 1}</div>
        <h4>${esc(pr.text)}</h4>
        ${g ? (gt ? `<p class="y-you">You said <b>“${esc(g.guess)}”</b> — ${esc(gt.name)}, +${g.points}</p>` : '<p class="y-you">Your time ran out on this one.</p>') : '<p class="y-you">You didn’t answer this one.</p>'}
        <div class="y-tiers"></div>
      </div>`);
      const wrap = sec.querySelector('.y-tiers');
      // Deepest first: the good stuff at the top.
      for (const tt of [...pr.tiers].reverse()) {
        const t = tierBy[tt.key];
        const row = h(`<div class="y-tier" style="--tc:${tierColor(t.key)}">
          <div></div>
          <div><div class="tn">${esc(t.name).toUpperCase()} <span>· ${t.depth}M · ${t.points}PTS</span></div><div class="chips"></div></div>
        </div>`);
        row.firstElementChild.replaceWith(Sprites.img(t.key, 3));
        const chips = row.querySelector('.chips');
        const LIMIT = 12;
        const mk = (a, k) => {
          const d = tt.descs && tt.descs[k];
          return h(`<span class="chip ${d ? 'has-desc' : ''} ${g && g.matched === a && g.tier === t.key ? 'you' : ''}">${esc(a)}${d ? `<small>${esc(d)}</small>` : ''}</span>`);
        };
        if (!tt.answers.length) chips.append(h('<span class="empty">—</span>'));
        tt.answers.slice(0, LIMIT).forEach((a, k) => chips.append(mk(a, k)));
        if (tt.answers.length > LIMIT) {
          const more = h(`<button class="chip more">+${tt.answers.length - LIMIT} more</button>`);
          more.addEventListener('click', () => { more.replaceWith(...tt.answers.slice(LIMIT).map((a, k) => mk(a, LIMIT + k))); });
          chips.append(more);
        }
        wrap.append(row);
      }
      node.append(sec);
    }
    show(node, 'yesterday');
  }

  // ------------------------------------------------------------------ admin
  function openAdmin() {
    NichionAdmin.open({ data: DATA, pristine: PRISTINE, onExit: () => { load(); renderTitle(); } });
  }
  addEventListener('hashchange', () => { if (location.hash === '#admin' && !document.getElementById('admin-root')) openAdmin(); });

  // ------------------------------------------------------------------- boot
  $('#btn-home').addEventListener('click', () => { if (S) renderTitle(); });
  $('#btn-help').addEventListener('click', () => { if (S) helpModal(); });
  $('#btn-yesterday').addEventListener('click', () => { if (S) renderYesterday(); });

  // Coming back to a tab left open overnight: refresh so it's the new day.
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !S || busy) return;
    if (Date.now() >= resetAt) { load(); renderTitle(); toast('A new dive is ready!'); }
  });

  (async function boot() {
    show(h('<section class="screen"><div class="loading">DIVING<span>…</span></div></section>'), 'loading');
    try {
      load();
      ocean.setDepth(depthSoFar(), { burst: false });
      renderTitle();
      if (location.hash === '#admin') return openAdmin();
      let seen = false;
      try { seen = localStorage.getItem('nichion_seen_help') === '1'; localStorage.setItem('nichion_seen_help', '1'); } catch {}
      if (!seen) setTimeout(helpModal, 500);
    } catch (e) {
      screenEl.innerHTML = '';
      console.error(e);
      show(h(`<section class="screen"><div class="loading">NO SIGNAL — ${esc(e.message)}</div></section>`), 'error');
    }
  })();
});

</script>
</body>
