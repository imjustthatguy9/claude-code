/* ==========================================================================
   NICHION — pixel ocean UI
   Everything snaps to a 4px grid; borders are drawn with stepped box-shadows
   so panels get the notched corners of an 8/16-bit UI.
   ========================================================================== */

:root {
  --px: 4px;
  --ink: #0b1426;
  --ink-2: #13203d;
  --panel: rgba(12, 26, 58, 0.9);
  --panel-solid: #0f2147;
  --panel-hi: #1a3266;
  --edge: #dff6ff;
  --edge-dim: #6f8fbf;
  --text: #eef8ff;
  --text-2: #b9cfee;
  --muted: #7f99c2;
  --accent: #ffd23f;
  --accent-dk: #c98a14;
  --danger: #ff6b6b;

  /* Tier colours (validated for colour-vision deficiency on the dark panel). */
  --t-plankton: #8be07a;
  --t-clever: #2fc4d6;
  --t-schooler: #3b6cf0;
  --t-rare: #c07bff;
  --t-deepcut: #ff5c7a;
  --t-nichion: #ffcf3f;
  --t-miss: #8aa1c4;

  --f-pixel: 'Press Start 2P', ui-monospace, monospace;
  --f-body: 'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: #0b1d3f;
  color: var(--text);
  font-family: var(--f-body);
  font-size: 18px;
  line-height: 1.35;
  -webkit-font-smoothing: none;
  font-variant-ligatures: none;
  font-feature-settings: 'liga' 0, 'clig' 0;
  overflow-x: hidden;
  overscroll-behavior: none;
}
button, input, textarea { font: inherit; color: inherit; }
img.sprite, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

#ocean { position: fixed; inset: 0; z-index: 0; display: block; }

#app {
  position: relative; z-index: 1;
  max-width: 540px; margin: 0 auto;
  min-height: 100dvh;
  display: flex; flex-direction: column;
  padding: 0 16px calc(16px + env(safe-area-inset-bottom));
}

/* ---------- pixel primitives ---------- */
.px-box {
  position: relative;
  background: var(--panel);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--edge),
    0 var(--px) 0 0 var(--edge),
    calc(-1 * var(--px)) 0 0 0 var(--edge),
    var(--px) 0 0 0 var(--edge),
    0 calc(3 * var(--px)) 0 0 rgba(0, 6, 20, 0.45),
    inset 0 var(--px) 0 0 rgba(255, 255, 255, 0.07),
    inset 0 calc(-1 * var(--px)) 0 0 rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(2px);
}
.px-box.dim {
  box-shadow:
    0 -4px 0 0 var(--edge-dim), 0 4px 0 0 var(--edge-dim),
    -4px 0 0 0 var(--edge-dim), 4px 0 0 0 var(--edge-dim),
    inset 0 4px 0 0 rgba(255, 255, 255, 0.05);
}

.btn {
  --b: var(--accent); --b-dk: var(--accent-dk); --b-ink: var(--ink);
  appearance: none; border: 0; cursor: pointer;
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 0 22px;
  font-family: var(--f-pixel); font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
  color: var(--b-ink); background: var(--b);
  box-shadow:
    0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink),
    inset 0 -6px 0 0 var(--b-dk), inset 0 4px 0 0 rgba(255, 255, 255, 0.45),
    0 10px 0 0 rgba(0, 6, 20, 0.45);
  transition: transform 80ms steps(2), filter 120ms;
  user-select: none; -webkit-tap-highlight-color: transparent;
  text-decoration: none;
}
.btn:hover { filter: brightness(1.08); }
.btn:active, .btn.pressed { transform: translateY(4px); box-shadow:
    0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink),
    inset 0 -2px 0 0 var(--b-dk), inset 0 4px 0 0 rgba(255,255,255,.3), 0 6px 0 0 rgba(0, 6, 20, 0.45); }
.btn:focus-visible { outline: 4px dashed var(--edge); outline-offset: 8px; }
.btn[disabled] { filter: grayscale(0.8) brightness(0.75); cursor: default; transform: none; }
.btn.blue { --b: #7fe3ff; --b-dk: #2f9fd8; }
.btn.ghost { --b: #1a3266; --b-dk: #0f2147; --b-ink: var(--text); }
.btn.wide { width: 100%; }
.btn.small { min-height: 40px; font-size: 10px; padding: 0 14px; }
.btn .arrow { display: inline-block; animation: nudge 1s steps(2) infinite; }
@keyframes nudge { 50% { transform: translateX(4px); } }

.icon-btn {
  appearance: none; background: none; border: 0; cursor: pointer;
  color: var(--text); padding: 8px; display: inline-flex; align-items: center;
  border-radius: 0;
}
.icon-btn:hover { color: var(--accent); }
.icon-btn:focus-visible { outline: 3px dashed var(--edge); outline-offset: 2px; }

.kicker { font-family: var(--f-pixel); font-size: 10px; letter-spacing: 2px; color: var(--text-2); text-transform: uppercase; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(8px + env(safe-area-inset-top)) 0 4px;
  transition: opacity 300ms;
}
.topbar.hide-logo .mini-logo { opacity: 0; }
.mini-logo {
  font-family: var(--f-pixel); font-size: 12px; letter-spacing: 1px;
  color: var(--text); text-shadow: 2px 2px 0 var(--ink);
  transition: opacity 300ms;
}
.topbar-actions { display: flex; gap: 4px; }
.topbar .icon-btn svg { filter: drop-shadow(2px 2px 0 var(--ink)); }

/* ---------- screens & transitions ---------- */
#screen { flex: 1; display: flex; flex-direction: column; position: relative; }
.screen { flex: 1; display: flex; flex-direction: column; animation: screen-in 380ms cubic-bezier(.2,.8,.2,1) both; }
.screen.leaving { animation: screen-out 200ms ease-in both; pointer-events: none; }
@keyframes screen-in { from { opacity: 0; transform: translateY(18px); } }
@keyframes screen-out { to { opacity: 0; transform: translateY(-12px); } }

/* ---------- title ---------- */
.title { align-items: center; text-align: center; }
.logo {
  margin: 4vh 0 6px;
  font-family: var(--f-pixel);
  font-size: clamp(22px, 7.4vw, 38px);
  letter-spacing: 1px;
  color: #fff6d8;
  text-shadow: 0 4px 0 #c9562b, 0 8px 0 var(--ink);
  white-space: nowrap;
  user-select: none;
}
.logo span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.tagline { font-size: 17px; color: #4a3266; font-weight: 600; margin: 6px 0 0; text-shadow: 0 1px 0 rgba(255,255,255,.4); }
.title-date { font-family: var(--f-pixel); font-size: 10px; color: #4a3266; margin-top: 10px; letter-spacing: 1px; }
.title-spacer { flex: 0 0 auto; height: max(100px, 20vh); }
.title-panel { width: 100%; padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 18px; }
.title-actions { display: grid; gap: 18px; }
.title-status { font-size: 16px; color: var(--text-2); margin: -4px 0 0; }
.title-status b { color: var(--accent); font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { text-align: center; padding: 8px 2px 6px; background: rgba(0, 8, 30, 0.45); }
.stat b { display: block; font-family: var(--f-pixel); font-size: 18px; color: var(--text); line-height: 1.4; }
.stat span { display: block; font-size: 13px; color: var(--text-2); line-height: 1.2; }
.stat.hot b { color: var(--accent); }
.stat .flame { display: inline-block; width: 12px; height: 14px; margin-right: 4px; vertical-align: -1px; }

.tier-legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tier-chip { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; background: rgba(0, 8, 30, 0.45); position: relative; }
.tier-chip img { height: 32px; width: auto; animation: floaty 3s ease-in-out infinite; }
.tier-chip:nth-child(2n) img { animation-delay: -1.5s; }
.tier-chip .tn { font-size: 14px; font-weight: 600; line-height: 1.1; }
.tier-chip .td { font-family: var(--f-pixel); font-size: 8px; color: var(--text-2); }
.tier-chip::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--tc); }
@keyframes floaty { 50% { transform: translateY(-3px); } }

/* ---------- HUD ---------- */
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 14px; margin-top: 6px; }
.hud-side { font-family: var(--f-pixel); font-size: 10px; color: var(--text-2); }
.hud-side b { display: block; font-size: 16px; color: var(--text); margin-top: 4px; transition: color 300ms; }
.hud-side.right { text-align: right; }
.hud-side b.bump { animation: bump 500ms steps(4); color: var(--accent); }
@keyframes bump { 30% { transform: scale(1.35); } }
.pips-wrap { text-align: center; }
.pips { display: flex; gap: 8px; justify-content: center; }
.pip {
  width: 20px; height: 20px; position: relative;
  background: rgba(0, 8, 30, 0.6);
  box-shadow: 0 -2px 0 0 var(--edge-dim), 0 2px 0 0 var(--edge-dim), -2px 0 0 0 var(--edge-dim), 2px 0 0 0 var(--edge-dim);
  transition: background 300ms;
}
.pip.current { box-shadow: 0 -2px 0 0 var(--accent), 0 2px 0 0 var(--accent), -2px 0 0 0 var(--accent), 2px 0 0 0 var(--accent); animation: pip-pulse 1.2s steps(2) infinite; }
.pip.done { background: var(--tc); box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink); }
.pip.done.miss { background: repeating-linear-gradient(45deg, #3a4f75 0 3px, #24365a 3px 6px); }
.pip.pop { animation: pip-pop 420ms steps(5); }
@keyframes pip-pulse { 50% { transform: translateY(-3px); } }
@keyframes pip-pop { 40% { transform: scale(1.5); } }
.pip-label { font-family: var(--f-pixel); font-size: 9px; color: var(--text-2); margin-top: 8px; letter-spacing: 1px; }

/* side depth gauge (wide screens) */
.gauge { display: none; }
@media (min-width: 820px) {
  .gauge.show {
    display: block; position: fixed; left: 28px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 60vh; z-index: 2;
    background: rgba(0, 8, 30, 0.55);
    box-shadow: 0 -3px 0 0 var(--edge-dim), 0 3px 0 0 var(--edge-dim), -3px 0 0 0 var(--edge-dim), 3px 0 0 0 var(--edge-dim);
  }
  .gauge .fill { position: absolute; left: 0; right: 0; top: 0; background: linear-gradient(#7fe3ff, #2390cc 30%, #164781 70%, #050d22); transition: height 1.2s cubic-bezier(.3,.8,.3,1); }
  .gauge .tick { position: absolute; left: 18px; font-family: var(--f-pixel); font-size: 8px; color: var(--muted); transform: translateY(-50%); white-space: nowrap; }
  .gauge .tick::before { content: ''; position: absolute; left: -10px; top: 50%; width: 6px; height: 2px; background: var(--edge-dim); }
  .gauge .marker { position: absolute; left: -10px; width: 34px; height: 4px; background: var(--accent); transition: top 1.2s cubic-bezier(.3,.8,.3,1); box-shadow: 0 0 0 2px var(--ink); }
  .gauge .marker span { position: absolute; left: 40px; top: -8px; font-family: var(--f-pixel); font-size: 10px; color: var(--accent); text-shadow: 2px 2px 0 var(--ink); white-space: nowrap; }
}

/* ---------- game card ---------- */
.window { flex: 1 1 auto; min-height: 22vh; }
.card { padding: 20px 18px 22px; margin-bottom: 8px; }
.card .kicker { display: flex; justify-content: space-between; }
.prompt-text {
  font-family: var(--f-body); font-weight: 700; font-size: clamp(24px, 6.4vw, 30px); line-height: 1.15;
  margin: 12px 0 18px; color: #fff; text-wrap: balance;
}
.prompt-text.typing { border-right: 4px solid var(--accent); }
.guess-form { display: flex; gap: 14px; align-items: stretch; }
.field {
  flex: 1; min-width: 0; height: 52px; padding: 0 14px;
  background: #050d22; color: #fff; border: 0; outline: 0;
  font-family: var(--f-body); font-size: 22px; font-weight: 500;
  box-shadow: 0 -4px 0 0 var(--edge-dim), 0 4px 0 0 var(--edge-dim), -4px 0 0 0 var(--edge-dim), 4px 0 0 0 var(--edge-dim), inset 0 4px 0 0 rgba(0,0,0,.5);
  caret-color: var(--accent);
  transition: box-shadow 150ms;
}
.field::placeholder { color: #4f6a96; }
.field:focus { box-shadow: 0 -4px 0 0 var(--accent), 0 4px 0 0 var(--accent), -4px 0 0 0 var(--accent), 4px 0 0 0 var(--accent), inset 0 4px 0 0 rgba(0,0,0,.5); }
.field.shake { animation: shake 300ms steps(6); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.hint { font-size: 15px; color: var(--muted); margin: 16px 0 0; display: flex; justify-content: space-between; gap: 8px; }
.hint kbd { font-family: var(--f-pixel); font-size: 8px; padding: 3px 5px; background: var(--ink-2); color: var(--text-2); }

/* result reveal */
.result { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; animation: result-in 500ms cubic-bezier(.2,1.4,.4,1) both; }
@keyframes result-in { from { opacity: 0; transform: scale(.92); } }
.result-art { width: 96px; height: 96px; display: grid; place-items: center; background: rgba(0, 8, 30, 0.55); position: relative; overflow: visible; }
.result-art::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px var(--tc); }
.result-art img { max-width: 84px; max-height: 80px; width: auto; height: auto; animation: creature-in 700ms cubic-bezier(.2,1.6,.4,1) both, floaty 2.4s 700ms ease-in-out infinite; }
@keyframes creature-in { from { transform: translateY(30px) scale(.3); opacity: 0; } }
.result-tier { font-family: var(--f-pixel); font-size: 15px; color: var(--tc); text-shadow: 2px 2px 0 var(--ink); line-height: 1.4; }
.result-gain { display: flex; gap: 14px; margin-top: 6px; font-family: var(--f-pixel); font-size: 11px; color: var(--text); }
.result-gain .pts { color: var(--accent); }
.result-guess { margin-top: 10px; font-size: 17px; color: var(--text-2); overflow-wrap: anywhere; }
.result-guess q { color: #fff; font-weight: 600; quotes: '“' '”'; }
.autocorrect { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 14px; color: var(--ink); background: #b8f0ff; padding: 2px 8px; box-shadow: 0 2px 0 0 #2f9fd8; }
.result-actions { grid-column: 1 / -1; margin-top: 10px; }
.result.miss .result-tier { color: var(--t-miss); }
.result.big .result-art { animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(255, 207, 63, .35), 0 0 30px rgba(255, 207, 63, .45); } }

/* screen flash for the deepest tier */
.flash { position: fixed; inset: 0; background: #fff3b0; z-index: 5; pointer-events: none; animation: flash 700ms ease-out forwards; }
@keyframes flash { from { opacity: .55; } to { opacity: 0; } }

/* ---------- results ---------- */
.results { gap: 22px; padding-top: 8px; }
.score-panel { padding: 22px 18px 20px; text-align: center; }
.score-panel .kicker { color: var(--accent); }
.rank { font-size: 22px; font-weight: 700; margin: 8px 0 4px; }
.big-score { font-family: var(--f-pixel); font-size: clamp(40px, 13vw, 58px); color: #fff; text-shadow: 0 4px 0 var(--accent-dk), 0 8px 0 var(--ink); margin: 14px 0 6px; line-height: 1.1; }
.big-score small { font-size: 14px; color: var(--text-2); text-shadow: none; margin-left: 6px; }
.score-sub { font-family: var(--f-pixel); font-size: 10px; color: var(--text-2); letter-spacing: 1px; }
.footnote { margin: 10px 0 0; font-size: 15px; color: var(--muted); font-style: normal; }
.share-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 20px; }
.countdown { margin-top: 18px; font-size: 15px; color: var(--text-2); }
.countdown b { font-family: var(--f-pixel); font-size: 13px; color: var(--text); margin-left: 6px; letter-spacing: 1px; }

.section { padding: 18px 16px 18px; }
.section h3 { margin: 0 0 2px; font-family: var(--f-pixel); font-size: 11px; letter-spacing: 1px; color: var(--text); font-weight: 400; }
.section .sub { margin: 0 0 14px; font-size: 15px; color: var(--muted); }

.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: 'Press Start 2P', monospace; font-size: 8px; fill: var(--text-2); }
.chart .val { fill: var(--text); font-size: 9px; }
.chart .grid { stroke: rgba(185, 207, 238, 0.14); stroke-width: 1; }
.chart .axis { stroke: rgba(185, 207, 238, 0.4); stroke-width: 2; }
.chart .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 700ms cubic-bezier(.2,.9,.3,1.2) both; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover + .bar, .chart g.on .bar, .chart g.on .dot { filter: brightness(1.25); }
@keyframes grow { from { transform: scaleY(0); } }
.chart .line { fill: none; stroke: var(--edge); stroke-width: 2; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.4s 200ms ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.chart .dot { stroke: var(--ink); stroke-width: 2; animation: dot-in 300ms steps(3) both; }
@keyframes dot-in { from { opacity: 0; } }
.chart .area { fill: url(#abyss); opacity: .55; }

.guess-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.guess-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 8px 10px; background: rgba(0, 8, 30, 0.45); position: relative; animation: screen-in 400ms both; }
.guess-row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tc); }
.guess-row img { max-width: 36px; max-height: 32px; width: auto; height: auto; justify-self: center; }
.guess-row .q { font-size: 14px; color: var(--muted); line-height: 1.2; }
.guess-row .a { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
.guess-row .a small { font-weight: 400; color: var(--text-2); font-size: 14px; }
.guess-row .p { font-family: var(--f-pixel); font-size: 11px; text-align: right; }
.guess-row .p small { display: block; font-size: 8px; color: var(--tc-text, var(--text-2)); margin-top: 6px; }

/* ---------- yesterday ---------- */
.yesterday { gap: 22px; padding-top: 8px; }
.y-head { padding: 18px; text-align: center; }
.y-head h2 { font-family: var(--f-pixel); font-size: 15px; margin: 8px 0 6px; font-weight: 400; line-height: 1.5; }
.y-prompt h4 { margin: 4px 0 12px; font-size: 22px; line-height: 1.2; }
.y-you { font-size: 15px; color: var(--text-2); margin: -4px 0 14px; }
.y-you b { color: var(--tc, #fff); }
.y-tiers { display: grid; gap: 8px; }
.y-tier { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 8px; background: rgba(0, 8, 30, 0.45); position: relative; }
.y-tier::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tc); }
.y-tier img { max-width: 36px; max-height: 30px; width: auto; height: auto; justify-self: center; margin-top: 2px; }
.y-tier .tn { font-family: var(--f-pixel); font-size: 9px; color: var(--tc); line-height: 1.6; }
.y-tier .tn span { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font-size: 15px; padding: 1px 8px; background: var(--ink-2); color: var(--text); }
.chip.you { background: var(--tc); color: var(--ink); font-weight: 700; }
.chip.more { background: none; color: var(--accent); cursor: pointer; border: 0; text-decoration: underline; text-underline-offset: 3px; }
.empty { color: var(--muted); font-size: 15px; font-style: italic; }

/* ---------- modal ---------- */
.modal-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(2, 6, 18, 0.7); display: grid; place-items: center; padding: 20px 16px; animation: fade 200ms both; }
.modal-backdrop.closing { animation: fade 160ms reverse both; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(500px, 100%); max-height: calc(100dvh - 40px); overflow: auto; padding: 22px 20px; animation: modal-in 320ms cubic-bezier(.2,1.3,.4,1) both; }
@keyframes modal-in { from { transform: translateY(24px) scale(.96); opacity: 0; } }
.modal h2 { font-family: var(--f-pixel); font-size: 14px; font-weight: 400; margin: 0 0 14px; line-height: 1.5; }
.modal p { margin: 0 0 12px; color: var(--text-2); }
.modal p b { color: var(--text); }
.modal .close { position: absolute; top: 10px; right: 10px; }
.modal .art { display: flex; justify-content: center; margin: 6px 0 16px; }
.modal ol { padding-left: 22px; margin: 0 0 14px; color: var(--text-2); }
.modal ol li { margin-bottom: 6px; }
.modal ol b { color: var(--text); }
.calm { text-align: center; }
.calm .art img { animation: floaty 3s ease-in-out infinite; }

/* ---------- tooltip & toast ---------- */
#tip {
  position: fixed; z-index: 65; pointer-events: none; max-width: 240px;
  padding: 8px 10px; background: #050d22; color: var(--text); font-size: 15px; line-height: 1.25;
  box-shadow: 0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge);
}
#tip b { color: var(--accent); }
#toast {
  position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); z-index: 70;
  transform: translate(-50%, calc(100% + 60px)); visibility: hidden; transition: transform 260ms cubic-bezier(.2,1.3,.4,1), visibility 0s 260ms;
  padding: 12px 16px; background: var(--accent); color: var(--ink); font-weight: 700; font-size: 16px;
  box-shadow: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink);
  max-width: calc(100% - 40px); text-align: center;
}
#toast.show { transform: translate(-50%, 0); visibility: visible; transition: transform 260ms cubic-bezier(.2,1.3,.4,1); }
#toast.error { background: var(--danger); }

.loading { margin: auto; font-family: var(--f-pixel); font-size: 12px; color: var(--text); text-shadow: 2px 2px 0 var(--ink); }
.loading span { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 400px) {
  .stats { gap: 6px; }
  .stat b { font-size: 15px; }
  .guess-form { gap: 12px; }
  .btn { padding: 0 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}

.modal .admin-link { display: block; margin: 16px auto 0; font-size: 14px; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.modal .admin-link:hover { color: var(--accent); }
.warn-line { font-size: 14px; color: var(--ink); background: #ffb3b3; padding: 4px 8px; margin: -6px 0 0; }

/* ---------- timer & tries ---------- */
.timer { position: relative; height: 8px; margin: 12px 0 0; background: rgba(0, 8, 30, 0.7);
  box-shadow: 0 -2px 0 0 var(--edge-dim), 0 2px 0 0 var(--edge-dim), -2px 0 0 0 var(--edge-dim), 2px 0 0 0 var(--edge-dim); }
.timer i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, #7fe3ff, #ffd23f);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.35); transition: width 100ms linear; }
.timer.low i { background: var(--danger); animation: blink 500ms steps(2) infinite; }
.timer.done i { animation: none; opacity: .5; }
.timer-num { font-family: var(--f-pixel); font-size: 12px; color: var(--text); min-width: 2.5em; text-align: right; }
.timer-num.low { color: var(--danger); }
.timer-num.tick { animation: bump 400ms steps(4); }
.tries { min-height: 0; }
.nope { margin: 12px 0 0; font-size: 16px; font-weight: 600; color: #ffb3c0; min-height: 0; }
.nope:empty { display: none; }
.nope.show { animation: nope-in 320ms steps(4); }
@keyframes nope-in { from { opacity: 0; transform: translateY(-4px); } }
.miss-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.miss-chips:empty { display: none; }
.miss-chip { font-size: 14px; padding: 1px 8px; background: rgba(255, 92, 122, 0.16); color: #ffc2cc; text-decoration: line-through; text-decoration-color: rgba(255, 194, 204, .6); animation: dot-in 200ms steps(2) both; }
.result-tries { margin-top: 8px; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.muted { color: var(--muted); }

/* ---------- come back tomorrow ---------- */
.comeback { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; margin-top: 16px; padding: 14px 14px 14px 16px;
  background: linear-gradient(135deg, rgba(255, 207, 63, 0.16), rgba(255, 154, 60, 0.06)); overflow: hidden; }
.comeback::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--t-nichion); }
.comeback::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 242, 176, 0.14) 45%, transparent 60%); transform: translateX(-100%); animation: shimmer 3.2s 0.8s ease-in-out infinite; pointer-events: none; }
@keyframes shimmer { 60%, 100% { transform: translateX(100%); } }
.comeback-art { width: 64px; height: 56px; display: grid; place-items: center; }
.comeback-art img { animation: floaty 2.6s ease-in-out infinite; }
.comeback-title { font-family: var(--f-pixel); font-size: 10px; letter-spacing: 1px; color: var(--t-nichion); text-shadow: 2px 2px 0 var(--ink); line-height: 1.5; }
.comeback p { margin: 6px 0 8px; font-size: 16px; color: var(--text); line-height: 1.3; }
.comeback-time { font-size: 14px; color: var(--text-2); }
.comeback-time b { font-family: var(--f-pixel); font-size: 10px; color: var(--accent); margin-left: 4px; letter-spacing: 1px; }
.comeback.compact { margin-top: 0; padding: 10px 12px 10px 14px; text-align: left; }
.comeback.compact .comeback-art { width: 44px; height: 40px; }
.comeback.compact p { font-size: 15px; margin: 4px 0 4px; }

/* ---------- answer descriptions (Nichion / Too Clever) ---------- */
.result-desc { margin-top: 8px; padding: 6px 10px; font-size: 15px; line-height: 1.3; color: var(--text); background: rgba(0, 8, 30, 0.55);
  box-shadow: inset 3px 0 0 var(--tc); font-style: italic; animation: dot-in 300ms 300ms both; overflow-wrap: anywhere; }
.result-desc::before { content: '“'; } .result-desc::after { content: '”'; }
.guess-row .desc { font-size: 14px; color: var(--text-2); font-style: italic; margin-top: 2px; }
.chip.has-desc { display: inline-flex; flex-direction: column; padding: 2px 8px 3px; }
.chip small { font-size: 12px; color: var(--text-2); font-style: italic; line-height: 1.2; }
.chip.you small { color: var(--ink); opacity: .8; }

#admin-root {
  position: fixed; inset: 0; z-index: 40; overflow: auto;
  padding: 20px 16px 80px;
  background:
    linear-gradient(rgba(11, 29, 63, 0.94), rgba(5, 13, 34, 0.98)),
    repeating-linear-gradient(0deg, #0b1d3f 0 4px, #0d2149 4px 8px);
  animation: fade 200ms both;
}
body.admin-open { overflow: hidden; }
body.admin-open #app { visibility: hidden; }
.a-top, .a-grid { max-width: 1240px; margin-left: auto; margin-right: auto; }
.publish-note { flex-basis: 100%; font-size: 15px; color: var(--ink); background: var(--accent); padding: 8px 12px; box-shadow: 0 3px 0 var(--accent-dk); }

.a-top { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; justify-content: space-between; margin-bottom: 28px; }

.login { max-width: 420px; margin: 12vh auto 0; padding: 26px 22px; text-align: center; }

.a-grid { display: grid; grid-template-columns: 340px 1fr; gap: 28px; align-items: start; }

/* calendar */
.a-side { display: grid; gap: 28px; position: sticky; top: 0; max-height: calc(100vh - 40px); overflow: auto; padding: 4px 4px 16px; margin: -4px; scrollbar-color: var(--edge-dim) transparent; }

.cal { padding: 16px 14px 18px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

.cal-day {
  appearance: none; border: 0; cursor: pointer; position: relative;

}
.cal-day:hover { background: var(--panel-hi); }
.cal-day:focus-visible { outline: 3px dashed var(--edge); outline-offset: 1px; }
.cal-day.out { opacity: 0.35; }

.pcard-head .tools .icon-btn:hover { color: var(--accent); }

.ptext { width: 100%; height: 50px; font-size: 22px; font-weight: 600; }

.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 20px; }

.tbox { background: rgba(0, 8, 30, 0.5); padding: 10px 10px 10px 14px; position: relative; }

.tbox textarea {
  width: 100%; min-height: 112px; resize: vertical; padding: 8px 10px;

}

.tester { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 18px; padding-top: 16px; border-top: 2px dashed rgba(185, 207, 238, 0.2); }
.tester .kicker { flex-basis: 100%; }
.tester input { flex: 1 1 200px; height: 42px; font-size: 18px; }
.tester .out { flex: 1 1 220px; font-size: 16px; color: var(--text-2); min-height: 24px; }
.tester .out b { color: var(--tc, #fff); }

.add-row { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin: 4px 0 40px; }
.help { padding: 16px 18px; font-size: 15px; color: var(--text-2); margin-bottom: 28px; }
.help code { font-family: var(--f-body); background: var(--ink-2); padding: 0 6px; color: var(--accent); }
.help ul { margin: 6px 0 0; padding-left: 20px; }
.empty-day { padding: 28px 20px; text-align: center; margin-bottom: 28px; }

/* past prompts library */
.lib { padding: 16px 14px 16px; }
.lib-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.lib-head h3 { margin: 0; font-family: var(--f-pixel); font-size: 10px; font-weight: 400; letter-spacing: 1px; }
.lib-count { font-family: var(--f-pixel); font-size: 8px; color: var(--muted); }
.lib-search { width: 100%; height: 40px; font-size: 17px; }
.lib-search::-webkit-search-cancel-button { filter: invert(1); }
.lib-filters { display: flex; gap: 6px; margin: 14px 0 10px; }
.lib-filter { appearance: none; border: 0; cursor: pointer; flex: 1; padding: 6px 4px; font-family: var(--f-pixel); font-size: 7px; letter-spacing: 1px; background: rgba(0, 8, 30, 0.55); color: var(--text-2); }

.lib-filter:focus-visible { outline: 2px dashed var(--edge); outline-offset: 2px; }

.lib-item summary::-webkit-details-marker { display: none; }
.lib-item summary:hover { background: var(--panel-hi); }
.lib-item summary:focus-visible { outline: 2px dashed var(--edge); outline-offset: -2px; }
.lib-item[open] summary { background: var(--panel-hi); }
.lib-date { font-family: var(--f-pixel); font-size: 7px; color: var(--muted); letter-spacing: 1px; }
.lib-text { grid-column: 1; font-size: 16px; font-weight: 600; line-height: 1.2; color: var(--text); }

.lib-dots i.off { background: rgba(185, 207, 238, 0.15); }
.lib-body { padding: 4px 10px 12px; }
.lib-tiers { display: grid; gap: 4px; margin-bottom: 12px; }

.lib-tier b { font-family: var(--f-pixel); font-size: 6px; font-weight: 400; color: var(--tc); padding-top: 3px; }
.lib-actions { display: flex; flex-wrap: wrap; gap: 14px; padding: 4px; }
.lib-actions .btn.small { min-height: 34px; font-size: 8px; padding: 0 10px; }
.lib-empty { margin: 6px 2px; font-size: 14px; color: var(--muted); font-style: italic; }
.lib-intro { margin: 0 34px 14px 0 !important; }
.pcard.flash { animation: card-flash 1.1s steps(6); }
@keyframes card-flash { 0%, 40% { box-shadow: 0 -4px 0 0 var(--accent), 0 4px 0 0 var(--accent), -4px 0 0 0 var(--accent), 4px 0 0 0 var(--accent), 0 0 30px rgba(255, 210, 63, .35); } }

/* paste as text */
.paste-modal { width: min(760px, 100%); }
.fmt { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start; margin-bottom: 14px; }
@media (max-width: 620px) { .fmt { grid-template-columns: 1fr; } }
.fmt-example { margin: 0; padding: 10px 14px; background: #050d22; color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.3;
  box-shadow: inset 0 0 0 2px rgba(111, 143, 191, .45); }
.fmt ul { margin: 0; padding-left: 18px; color: var(--text-2); font-size: 15px; }
.fmt li { margin-bottom: 6px; }
.fmt li b { color: var(--text); }
.fmt code { font-family: var(--f-body); background: var(--ink-2); padding: 0 5px; color: var(--accent); }
.fmt-order { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; }
.fmt-order i { font-style: normal; font-size: 13px; padding: 0 6px; background: var(--tc); color: var(--ink); font-weight: 700; }
.fmt-order span { color: var(--muted); font-size: 12px; }
.paste-area { width: 100%; min-height: 170px; resize: vertical; padding: 10px 12px; background: #050d22; border: 0; outline: 0; color: #fff;
  font-family: var(--f-body); font-size: 17px; line-height: 1.35; box-shadow: inset 0 0 0 2px var(--edge-dim); }
.paste-area:focus { box-shadow: inset 0 0 0 2px var(--accent); }
.paste-preview { display: grid; gap: 10px; margin: 14px 0 4px; }
.pv { background: rgba(0, 8, 30, 0.5); padding: 10px 12px; animation: dot-in 200ms both; }
.pv.off { opacity: .45; }
.pv-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 8px; }
.pv-head b { font-size: 18px; }
.pv-slot { font-family: var(--f-pixel); font-size: 7px; color: var(--accent); letter-spacing: 1px; }
.pv-tiers { display: grid; gap: 3px; }
.pv-tier { display: grid; grid-template-columns: 88px 1fr; gap: 8px; align-items: baseline; font-size: 14px; color: var(--muted); }
.pv-tier b { font-family: var(--f-pixel); font-size: 7px; font-weight: 400; color: var(--tc); }
.pv-tier.empty b { opacity: .45; }
.pv-tier em { font-style: normal; color: var(--text); background: var(--ink-2); padding: 0 6px; margin: 0 4px 3px 0; display: inline-block; }
.pv-warn { margin: 8px 0 0 !important; font-size: 14px; color: #ffb3c0 !important; }
.paste-actions { display: flex; flex-wrap: wrap; gap: 20px; justify-content: flex-end; margin-top: 18px; }

/* duplicates */
.dup-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-top: 14px; padding: 8px 10px 8px 12px;
  background: rgba(255, 92, 122, 0.12); box-shadow: inset 4px 0 0 var(--danger); font-size: 15px; color: #ffd0d8; animation: dot-in 200ms both; }
.dup-bar[hidden] { display: none; }
.dup-bar b { color: #fff; }
.dup-bar .btn.small { min-height: 34px; font-size: 8px; padding: 0 12px; }
.tbox .warn { color: #ffb3c0; }
.cleanup-note { padding: 14px 16px; margin-bottom: 28px; animation: screen-in 380ms both; }
.cleanup-head { display: flex; justify-content: space-between; align-items: center; }
.cleanup-head b { font-family: var(--f-pixel); font-size: 9px; font-weight: 400; color: var(--accent); letter-spacing: 1px; }
.cleanup-note ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 15px; color: var(--text-2); }
.cleanup-note li span { font-family: var(--f-pixel); font-size: 7px; color: var(--muted); margin-right: 8px; }
.pv-note { margin: 6px 0 0 !important; font-size: 14px; color: var(--text-2) !important; }
/* Typed formats need unambiguous [] - | characters, which the pixel font squashes. */
.paste-area, .fmt-example, .fmt code, .help code { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; }

.pv-tier em small { display: block; font-size: 12px; color: var(--muted); font-style: italic; }

<body>
<canvas id="ocean" aria-hidden="true"></canvas>
<div id="app">
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="btn-home" aria-label="Home"><span class="mini-logo">NICHION</span></button>
    <nav class="topbar-actions">
      <button class="icon-btn" id="btn-yesterday" aria-label="Yesterday's answers" data-tip="Yesterday's answers">
        <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M3 1h2v2h6V1h2v2h2v12H1V3h2zM3 6v7h10V6zm2 2h2v2H5zm4 0h2v2H9z"/></svg>
      </button>
      <button class="icon-btn" id="btn-help" aria-label="How to play" data-tip="How to play">
        <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M5 1h6v1h2v2h1v4h-1v1h-2v1H9v2H7V9h1V8h2V7h1V4h-1V3H6v1H5v2H3V4h1V2h1zM7 13h2v2H7z"/></svg>
      </button>
    </nav>
  </header>
  <div id="depth-gauge" class="gauge" aria-hidden="true"></div>
  <main id="screen" aria-live="polite"></main>
</div>
<div id="modal-root"></div>
<div id="tip" role="tooltip" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// Nichion game engine: tiers, answer matching (auto-correct), day handling,
// the scrambled answer store, and the player's saved progress.
// Runs in the browser and in Node (for tests and the build script).
(function (root) {
  'use strict';

  // ------------------------------------------------------------------ tiers
  const TIERS = [
    { key: 'plankton', name: 'Plankton',   depth: 10,  points: 10  },
    { key: 'clever',   name: 'Too Clever', depth: 15,  points: 15  },
    { key: 'schooler', name: 'Schooler',   depth: 30,  points: 30  },
    { key: 'rare',     name: 'Rare',       depth: 60,  points: 60  },
    { key: 'deepcut',  name: 'Deep Cut',   depth: 85,  points: 85  },
    { key: 'nichion',  name: 'Nichion',    depth: 100, points: 100 },
  ];
  const TIER_BY_KEY = Object.fromEntries(TIERS.map(t => [t.key, t]));
  const MAX_PROMPTS = 5;
  const MAX_GUESS_LEN = 60;
  const TIME_LIMIT_MS = 25000;   // per prompt
  const GRACE_MS = 750;          // a guess typed in the last instant still counts
  const MAX_MISSES = 60;

  // --------------------------------------------------------------- matching
  // Admin answer lines: "New York City | NYC | Big Apple" — first is shown.
  // An optional description goes after an asterisk + parentheses:
  //   "cat | kitty *(feline friend)"
  // Players see it for Nichion and Too Clever answers. Also accepted: a
  // trailing asterisk "*(…)*", brackets inside "*(a (big) cat)", and a
  // forgotten closing bracket "*(feline friend".
  const DESC_RE = /\*\(/;                                      // "has a description?"
  const DESC_PATTERNS = [
    /\*\(\s*(.*)\)\s*\*?\s*$/,        // at the end of the line, up to the last ")"
    /\*\(\s*([^)]*?)\s*\)\s*\*?/,     // somewhere in the middle
    /\*\(\s*(.*)$/,                    // never closed
  ];
  const DESC_TIERS = ['nichion', 'clever'];

  function parseAnswer(line) {
    let str = String(line);
    let desc = null;
    for (const re of DESC_PATTERNS) {
      const m = str.match(re);
      if (m) { desc = m[1].replace(/\s+/g, ' ').trim() || null; str = str.replace(re, ' '); break; }
    }
    const spellings = str.split('|').map(s => s.trim()).filter(Boolean);
    return spellings.length ? { display: spellings[0], spellings, desc } : null;
  }

  /** Rebuild an answer line from its parts. */
  const formatAnswer = (spellings, desc) => spellings.join(' | ') + (desc ? ` *(${desc})` : '');

  function normalize(s) {
    return String(s)
      .normalize('NFKD').replace(/[̀-ͯ]/g, '')
      .toLowerCase()
      .replace(/&/g, ' and ')
      .replace(/['’`]/g, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim()
      .replace(/^(the|a|an)\s+/, '')
      .replace(/\s+/g, ' ');
  }

  function singularize(w) {
    if (w.length <= 3) return w;
    if (w.endsWith('ies') && w.length > 4) return w.slice(0, -3) + 'y';
    if (w.endsWith('ves') && w.length > 4) return w.slice(0, -3) + 'f';
    if (/(ses|xes|zes|ches|shes)$/.test(w)) return w.slice(0, -2);
    if (w.endsWith('s') && !/(ss|us|is)$/.test(w)) return w.slice(0, -1);
    return w;
  }

  function keys(s) {
    const n = normalize(s);
    const out = new Set([n.replace(/ /g, ''), n.split(' ').map(singularize).join('')]);
    return [...out].filter(Boolean);
  }

  // Levenshtein + adjacent transpositions, with an early exit past `cap`.
  function editDistance(a, b, cap = Infinity) {
    if (a === b) return 0;
    if (Math.abs(a.length - b.length) > cap) return cap + 1;
    let prev2 = null, prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let rowMin = i;
      for (let j = 1; j <= b.length; j++) {
        let v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (prev2 && i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, prev2[j - 2] + 1);
        cur[j] = v;
        if (v < rowMin) rowMin = v;
      }
      if (rowMin > cap) return cap + 1;
      prev2 = prev; prev = cur;
    }
    return prev[b.length];
  }

  // Typos forgiven by answer length: 1–3 exact, 4–5 one, 6–9 two, 10+ three.
  const allowedTypos = len => (len <= 3 ? 0 : len <= 5 ? 1 : len <= 9 ? 2 : 3);

  /** Best match for a guess: exact beats fuzzy; on a tie the deeper tier wins. */
  function matchGuess(guess, answers) {
    const gKeys = keys(guess);
    if (!gKeys.length) return null;
    let best = null;
    for (let t = TIERS.length - 1; t >= 0; t--) {
      const tier = TIERS[t];
      for (const line of (answers && answers[tier.key]) || []) {
        const ans = parseAnswer(line);
        if (!ans) continue;
        for (const spelling of ans.spellings) {
          for (const ak of keys(spelling)) {
            const cap = allowedTypos(ak.length);
            for (const gk of gKeys) {
              const d = editDistance(gk, ak, cap);
              if (d <= cap && (!best || d < best.distance)) {
                best = { tier: tier.key, display: ans.display, desc: DESC_TIERS.includes(tier.key) ? ans.desc : null, corrected: d > 0, distance: d };
              }
            }
          }
        }
      }
      if (best && best.distance === 0) return best;
    }
    return best;
  }

  // ------------------------------------------------------------- dedupe
  // Two spellings are the "same answer" when they normalise to the same key
  // (case, punctuation, accents, the/a/an, plurals), or are a near-miss typo
  // of a longish word. Stricter than in-game auto-correct on purpose, so
  // different answers like "Iran"/"Iraq" are never merged.
  function nearDuplicate(aKeys, bKeys) {
    for (const a of aKeys) {
      for (const b of bKeys) {
        if (a === b) return true;
        const len = Math.min(a.length, b.length);
        if (len < 6) continue;
        const d = editDistance(a, b, 2);
        if (d <= 1 || (len >= 10 && d <= 2)) return true;
      }
    }
    return false;
  }

  /**
   * Remove duplicate / near-duplicate answers, keeping the one in the deepest
   * tier (and the first one within a tier). Works per spelling, so a matching
   * alias is dropped without losing the rest of its line.
   * @returns {{ answers: Record<string,string[]>, removed: {spelling, tier, keptTier, keptAs, exact}[] }}
   */
  function dedupeAnswers(answers) {
    const kept = [];          // { keys, tier, display }
    const removed = [];
    const out = Object.fromEntries(TIERS.map(t => [t.key, []]));
    for (let t = TIERS.length - 1; t >= 0; t--) {
      const tier = TIERS[t].key;
      for (const line of (answers && answers[tier]) || []) {
        const ans = parseAnswer(line);
        if (!ans) continue;
        const keepSpellings = [];
        const lineKept = [];
        for (const sp of ans.spellings) {
          const k = keys(sp);
          if (!k.length) continue;
          const hit = kept.find(e => nearDuplicate(e.keys, k)) || lineKept.find(e => nearDuplicate(e.keys, k) && e.self);
          if (hit && !hit.self) {
            removed.push({ spelling: sp, tier, keptTier: hit.tier, keptAs: hit.display, exact: hit.keys.some(x => k.includes(x)) });
            continue;
          }
          if (hit && hit.self) continue;             // same spelling twice on one line: drop silently
          keepSpellings.push(sp);
          lineKept.push({ keys: k, self: true });
        }
        if (!keepSpellings.length) continue;
        const display = keepSpellings[0];
        for (const e of lineKept) kept.push({ keys: e.keys, tier, display });
        out[tier].push(formatAnswer(keepSpellings, ans.desc));
      }
    }
    return { answers: out, removed };
  }

  /** Back-compat: list of what dedupeAnswers would remove. */
  function findDuplicates(answers) {
    return dedupeAnswers(answers).removed.map(r => ({ spelling: r.spelling, tiers: [r.keptTier, r.tier], keptAs: r.keptAs }));
  }

  function describeRemoval(r) {
    const same = r.tier === r.keptTier;
    return same
      ? `“${r.spelling}” was listed twice in ${TIER_BY_KEY[r.tier].name}`
      : `“${r.spelling}” removed from ${TIER_BY_KEY[r.tier].name} — kept as “${r.keptAs}” in ${TIER_BY_KEY[r.keptTier].name}`;
  }

  // ------------------------------------------------------------------- days
  // A day is the player's own local calendar day.
  const pad = n => String(n).padStart(2, '0');
  const localDate = (now = new Date()) => `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  function addDays(date, n) {
    const d = new Date(date + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function msUntilMidnight(now = new Date()) {
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    return Math.max(1000, next - now);
  }
  const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && addDays(s, 0) === s;

  // ------------------------------------------------------------------ codec
  // Prompts and answers are stored scrambled (XOR with a per-day keystream,
  // then base64) so they can't be read by viewing the page source.
  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h || 1;
  }
  function keystream(seed, n) {
    let x = seed >>> 0;
    const out = new Uint8Array(n);
    for (let i = 0; i < n; i++) { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; out[i] = x & 255; }
    return out;
  }
  function toB64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
  function fromB64(b64) { const s = atob(b64); const out = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; }

  function encodeDay(salt, date, prompts) {
    const bytes = new TextEncoder().encode(JSON.stringify(prompts));
    const ks = keystream(fnv1a(salt + '|' + date), bytes.length);
    for (let i = 0; i < bytes.length; i++) bytes[i] ^= ks[i];
    return { n: prompts.length, d: toB64(bytes) };
  }
  function decodeDay(salt, date, entry) {
    if (!entry || !entry.d) return [];
    const bytes = fromB64(entry.d);
    const ks = keystream(fnv1a(salt + '|' + date), bytes.length);
    for (let i = 0; i < bytes.length; i++) bytes[i] ^= ks[i];
    try { return JSON.parse(new TextDecoder().decode(bytes)); } catch { return []; }
  }

  /** Clean admin input into the stored prompt shape. */
  function cleanPrompts(input) {
    const out = [];
    for (const p of (input || []).slice(0, MAX_PROMPTS)) {
      const text = String((p && p.text) || '').trim().slice(0, 200);
      const answers = {};
      let count = 0;
      for (const t of TIERS) {
        const raw = p && p.answers && p.answers[t.key];
        const list = Array.isArray(raw) ? raw : String(raw || '').split('\n');
        answers[t.key] = list.map(s => String(s).trim().slice(0, 400)).filter(Boolean).slice(0, 300);
        count += answers[t.key].length;
      }
      if (text || count) out.push({ text, answers: dedupeAnswers(answers).answers });
    }
    return out;
  }

  // ------------------------------------------------------------ text import
  // Quick paste format for admins:
  //
  //   Name an animal          ← first line: the question
  //                           ← blank line
  //   fox                     ← Nichion answers
  //                           ← blank line
  //   cat                     ← Deep Cut answers
  //   mouse
  //                           ← …then Rare, Schooler, Too Clever, Plankton
  //
  // A group that is just "[]" (or "-" / "none") leaves that tier empty. A line of
  // three or more dashes ("---") starts another question.
  const TEXT_ORDER = TIERS.map(t => t.key).reverse();   // nichion → plankton
  const EMPTY_GROUP = /^(\[\s*\]|-|—|–|none|\(none\)|n\/a|empty)$/i;
  const EMPTY_MARK = /^\[\s*\]$/;

  function cleanLine(line) {
    return line.replace(/^\s*(?:[-*•·]\s+|\d+[.)]\s+)/, '').trim();
  }

  function parseQuestionText(raw) {
    const chunks = String(raw || '').replace(/\r\n?/g, '\n').split(/^\s*-{3,}\s*$/m);
    const out = [];
    for (const chunk of chunks) {
      const lines = chunk.split('\n').map(l => l.replace(/\s+$/, ''));
      while (lines.length && !lines[0].trim()) lines.shift();
      if (!lines.length) continue;
      const text = cleanLine(lines.shift()).replace(/^(q|question)\s*[:.]\s*/i, '');
      // Group the rest by blank lines.
      const groups = [];
      let cur = null;
      for (const l of lines) {
        if (!l.trim()) { cur = null; continue; }
        if (!cur) groups.push(cur = []);
        cur.push(cleanLine(l));
      }
      const answers = Object.fromEntries(TIERS.map(t => [t.key, []]));
      const warnings = [];
      groups.forEach((g, i) => {
        if (i >= TEXT_ORDER.length) return;
        if (g.length === 1 && EMPTY_GROUP.test(g[0])) return;
        answers[TEXT_ORDER[i]] = g.filter(a => a && !EMPTY_MARK.test(a));   // a stray [] is never an answer
      });
      if (groups.length > TEXT_ORDER.length) {
        warnings.push(`${groups.length - TEXT_ORDER.length} extra group${groups.length - TEXT_ORDER.length === 1 ? '' : 's'} after Plankton ignored`);
      }
      if (!groups.length) warnings.push('No answers found — put a blank line after the question, then the answers');
      for (const [k, list] of Object.entries(answers)) {
        if (DESC_TIERS.includes(k)) continue;
        const n = list.filter(a => DESC_RE.test(a)).length;
        if (n) warnings.push(`${TIER_BY_KEY[k].name} has ${n} description${n === 1 ? '' : 's'} — only Nichion and Too Clever show descriptions`);
      }
      const dd = dedupeAnswers(answers);
      const notes = dd.removed.map(describeRemoval);
      out.push({ text, answers: dd.answers, warnings, notes });
    }
    return out;
  }

  /** Turn a prompt back into the paste format (used for "copy as text"). */
  function promptToText(p) {
    const groups = TEXT_ORDER.map(k => (p.answers[k] || []).filter(Boolean));
    while (groups.length && !groups[groups.length - 1].length) groups.pop();
    return [p.text, ...groups.map(g => (g.length ? g.join('\n') : '[]'))].join('\n\n');
  }


  // Small pure-JS SHA-256 (crypto.subtle isn't available on every file:// page).
  function sha256(msg) {
    const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const bytes = new TextEncoder().encode(msg);
    const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
    const buf = new Uint8Array(total);
    buf.set(bytes); buf[len] = 0x80;
    const view = new DataView(buf.buffer);
    view.setUint32(total - 4, (len * 8) >>> 0); view.setUint32(total - 8, Math.floor(len / 0x20000000));
    const w = new Uint32Array(64), rotr = (x, n) => (x >>> n) | (x << (32 - n));
    for (let o = 0; o < total; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = view.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
      }
      let [a, b, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
        const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    return H.map(x => x.toString(16).padStart(8, '0')).join('');
  }

  // ---------------------------------------------------------------- storage
  function makeStorage(key) {
    let mem = null;
    return {
      persistent: (() => { try { localStorage.setItem('__nichion', '1'); localStorage.removeItem('__nichion'); return true; } catch { return false; } })(),
      get() {
        try { const v = localStorage.getItem(key); if (v) return JSON.parse(v); } catch {}
        return mem;
      },
      set(v) { mem = v; try { localStorage.setItem(key, JSON.stringify(v)); } catch {} },
    };
  }

  // ------------------------------------------------------------------- game
  class GuessError extends Error { constructor(code, message) { super(message); this.code = code; } }

  class Game {
    /** @param data {salt, days:{date:{n,d}}}  @param storage {get,set}  @param now () => Date */
    constructor(data, storage, now = () => new Date()) {
      this.data = data; this.storage = storage; this.now = now;
      this.save = storage.get() || { plays: {}, maxSeen: null };
      this.save.plays = this.save.plays || {};
    }
    today() { return localDate(this.now()); }
    count(date) { return (this.data.days[date] && this.data.days[date].n) || 0; }
    prompts(date) { return decodeDay(this.data.salt, date, this.data.days[date]); }
    persist() { this.storage.set(this.save); }

    /** True when the device clock is earlier than a day this browser has already seen. */
    clockProblem() {
      const t = this.today();
      if (!this.save.maxSeen || t > this.save.maxSeen) { this.save.maxSeen = t; this.persist(); }
      return t < this.save.maxSeen ? this.save.maxSeen : null;
    }

    play(date) { return this.save.plays[date] || { guesses: [] }; }
    isComplete(date) { const n = this.count(date); return n > 0 && this.play(date).guesses.length >= n; }

    publicPlay(date) {
      const total = this.count(date);
      const play = this.play(date);
      const answered = play.guesses.length;
      const done = total > 0 && answered >= total;
      let prompts = [];
      if (total) {
        const all = this.prompts(date);
        for (let i = 0; i < total && i <= answered; i++) prompts.push({ index: i, text: (play.guesses[i] && play.guesses[i].prompt) || all[i].text });
      }
      const started = play.started && play.started[answered];
      return {
        date, total, done, prompts,
        current: done ? null : answered,
        deadline: !done && started ? started + TIME_LIMIT_MS : null,
        misses: (!done && play.misses && play.misses[answered]) || [],
        score: play.guesses.reduce((s, g) => s + g.points, 0),
        maxScore: total * 100,
        guesses: play.guesses.slice(),
      };
    }

    _todayPlay(date) {
      const today = this.today();
      if (this.clockProblem()) throw new GuessError('clock', 'Your device clock looks like it went backwards.');
      if (date !== today) throw new GuessError('day_changed', 'A new day has started — reload to dive again.');
      const prompts = this.prompts(today);
      if (!prompts.length) throw new GuessError('no_prompts', 'There are no prompts today.');
      const play = this.save.plays[today] || (this.save.plays[today] = { guesses: [] });
      play.started = play.started || {};
      play.misses = play.misses || {};
      if (play.guesses.length >= prompts.length) throw new GuessError('done', 'You already finished today’s dive.');
      return { play, prompts };
    }

    _expired(play, index, slack = GRACE_MS) {
      const s = play.started && play.started[index];
      if (!s) return false;
      const now = +this.now();
      // Turning the clock back mid-prompt also ends it.
      return now > s + TIME_LIMIT_MS + slack || now < s - 2000;
    }

    _record(play, prompts, index, fields) {
      const rec = {
        index, prompt: prompts[index].text, guess: '', tier: null, matched: null, corrected: false,
        points: 0, depth: 0, timedOut: false, misses: (play.misses[index] || []).slice(), ...fields,
      };
      play.guesses.push(rec);
      this.persist();
      return rec;
    }

    /** Start (or resume) the 25-second clock for a prompt. Returns the deadline (ms). */
    start({ date, index }) {
      const { play } = this._todayPlay(date);
      if (index !== play.guesses.length) throw new GuessError('out_of_order', 'That prompt was already answered.');
      if (!play.started[index]) { play.started[index] = +this.now(); this.persist(); }
      return play.started[index] + TIME_LIMIT_MS;
    }

    /** Ends today's current prompt with 0 points if its time has run out. */
    expireIfNeeded() {
      const today = this.today();
      const play = this.save.plays[today];
      if (!play || !play.started) return null;
      const index = play.guesses.length;
      if (index >= this.count(today) || !this._expired(play, index)) return null;
      return this._record(play, this.prompts(today), index, { timedOut: true });
    }

    /** Called by the UI when the countdown hits zero. */
    timeUp({ date, index }) {
      const { play, prompts } = this._todayPlay(date);
      if (index !== play.guesses.length) throw new GuessError('out_of_order', 'That prompt was already answered.');
      if (!this._expired(play, index, -GRACE_MS)) throw new GuessError('not_yet', 'There’s still time left.');
      return this._record(play, prompts, index, { timedOut: true });
    }

    /**
     * Try an answer. Not on the board → { invalid: true } and the prompt stays
     * open (until the time runs out). On the board → the prompt is scored.
     */
    guess({ date, index, guess }) {
      const { play, prompts } = this._todayPlay(date);
      if (index !== play.guesses.length) throw new GuessError('out_of_order', 'That prompt was already answered.');
      const text = typeof guess === 'string' ? guess.trim().replace(/\s+/g, ' ') : '';
      if (!text) throw new GuessError('empty', 'Type an answer first.');
      if (text.length > MAX_GUESS_LEN) throw new GuessError('too_long', `Keep it under ${MAX_GUESS_LEN} characters.`);
      if (!play.started[index]) play.started[index] = +this.now();
      if (this._expired(play, index)) return this._record(play, prompts, index, { timedOut: true });

      const m = matchGuess(text, prompts[index].answers);
      if (!m) {
        const misses = play.misses[index] || (play.misses[index] = []);
        const repeat = misses.some(x => normalize(x) === normalize(text));
        if (!repeat && misses.length < MAX_MISSES) misses.push(text);
        this.persist();
        return { invalid: true, repeat, index, guess: text, misses: misses.slice() };
      }
      const tier = TIER_BY_KEY[m.tier];
      return this._record(play, prompts, index, {
        guess: text, tier: tier.key, matched: m.display, desc: m.desc || null, corrected: m.corrected,
        points: tier.points, depth: tier.depth,
      });
    }

    /** Completed-day streaks; days with no prompts are skipped, today only counts once done. */
    stats() {
      const today = this.today();
      const dates = Object.keys(this.save.plays).filter(d => d <= today).sort();
      const done = dates.filter(d => this.isComplete(d));
      const scores = done.map(d => this.play(d).guesses.reduce((s, g) => s + g.points, 0));
      let run = 0, best = 0;

      ctx.drawImage(this.bg, 0, cy, W, H, 0, 0, W, H);

      const sy = y => Math.round(y - cy);
      const visible = (y, h = 20) => y - cy > -h && y - cy < H + h;

      // Light shafts near the surface.
      const shaftFade = 1 - Math.min(1, cy / (METRE * 120));
      if (shaftFade > 0) {
        ctx.save();
        ctx.globalAlpha = 0.10 * shaftFade;
        ctx.fillStyle = '#e8fbff';
        for (let i = 0; i < 5; i++) {
          const x0 = ((i * 53 + this.t * 3) % (W + 80)) - 40;
          const wob = Math.sin(this.t * 0.7 + i) * 4;
          ctx.beginPath();
          ctx.moveTo(x0 + wob, sy(SKY));
          ctx.lineTo(x0 + 10 + wob, sy(SKY));
          ctx.lineTo(x0 + 50, sy(SKY + 220));
          ctx.lineTo(x0 + 26, sy(SKY + 220));
          ctx.fill();
        }
        ctx.restore();
      }

      // Marine snow (more visible deeper).
      ctx.fillStyle = '#cfe8ff';
      for (const s of this.snow) {
        if (!visible(s.y, 2)) continue;
        const deep = (s.y - SKY) / (WORLD_H - SKY);
        if (deep > 0.45 && s.v > 2.6) {
          // Bioluminescent specks that blink in the deep.
          ctx.fillStyle = '#7fe3ff';
          ctx.globalAlpha = Math.max(0, Math.sin(this.t * 2 + s.x)) * 0.9;
          ctx.fillRect(Math.round(s.x), sy(s.y), 1, 1);
          ctx.fillStyle = '#cfe8ff';
          continue;
        }
        ctx.globalAlpha = 0.15 + deep * 0.5;
        ctx.fillRect(Math.round(s.x), sy(s.y), 1, 1);
      }
      ctx.globalAlpha = 1;

      // Critters.
      for (const c of this.critters) {
        if (!visible(c.y, 30)) continue;
        const deep = (c.y - SKY) / (WORLD_H - SKY);
        if (c.glow) {
          // Lure glow first so it sits behind the body.
          const s = Sprites.SPRITES[c.sprite];
          const lx = Math.round(c.x) + (c.vx > 0 ? 9 : s.w - 11), ly = sy(c.y) + 1;
          ctx.globalAlpha = 0.18 + 0.1 * Math.sin(this.t * 3 + c.phase);
          ctx.fillStyle = '#fff3a0';
          ctx.fillRect(lx - 4, ly - 2, 10, 6); ctx.fillRect(lx - 2, ly - 4, 6, 10);
          ctx.globalAlpha = 1;
        }
        Sprites.draw(ctx, c.sprite, c.x, sy(c.y), { flip: c.vx < 0, alpha: c.tiny ? 0.55 : Math.max(0.35, 0.95 - deep * 0.5) });
      }

      // Waterline: animated wave crest.
      const wl = sy(SKY);
      if (wl > -4 && wl < H + 4) {
        for (let x = 0; x < W; x++) {
          const h = Math.round(Math.sin(x * 0.12 + this.t * 2) * 1.5 + Math.sin(x * 0.05 - this.t) * 1);
          ctx.fillStyle = '#e9fbff'; ctx.fillRect(x, wl + h - 1, 1, 1);
          ctx.fillStyle = '#9feaff'; ctx.fillRect(x, wl + h, 1, 2);
        }
      }

      // Depth darkness + sub headlight.
      const subScreenY = sy(this.subY);
      const darkness = Math.min(0.55, Math.max(0, (this.subY - SKY) / (METRE * MAX_DEPTH)) * 0.6);
      if (darkness > 0.02) {
        ctx.fillStyle = `rgba(0,3,12,${darkness})`;
        ctx.fillRect(0, 0, W, H);
      }
      if (this.depth > 150 && this.mode === 'dive') {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        // Three nested cones = a stepped, pixel-style falloff.
        const a = Math.min(0.07, (this.depth - 150) / 1800);
        ctx.fillStyle = '#fff2a8';
        for (const [len, spread] of [[56, 22], [40, 15], [24, 9]]) {
          ctx.globalAlpha = a;
          ctx.beginPath();
          ctx.moveTo(W / 2 + 8, subScreenY + 1);
          ctx.lineTo(W / 2 + 8 + len, subScreenY + 1 + spread);
          ctx.lineTo(W / 2 + 8 + len, subScreenY + 1 - spread * 0.7);
          ctx.fill();
        }
        ctx.restore();
      }

      // Bubbles.
      for (const b of this.bubbles) {
        const y = sy(b.y);
        ctx.globalAlpha = Math.min(1, b.life);
        ctx.fillStyle = '#d6f8ff';
        if (b.r === 1) ctx.fillRect(Math.round(b.x), y, 1, 1);
        else { ctx.fillRect(Math.round(b.x), y, 2, 1); ctx.fillRect(Math.round(b.x) - 1, y + 1, 1, 1); ctx.fillRect(Math.round(b.x) + 2, y + 1, 1, 1); ctx.fillRect(Math.round(b.x), y + 2, 2, 1); }
      }
      ctx.globalAlpha = 1;

      // The sub, with a little bob and a tether line to the surface.
      const bob = Math.round(Math.sin(this.t * 2.2) * 1.5);
      const sxp = Math.round(W / 2 - 8);
      if (this.mode === 'dive') {
        ctx.fillStyle = 'rgba(220,240,255,0.35)';
        for (let y = Math.max(0, wl); y < subScreenY + bob; y += 3) ctx.fillRect(Math.round(W / 2), y, 1, 2);
      }
      Sprites.draw(ctx, 'sub', sxp, subScreenY - 6 + bob);

      for (const s of this.sparkles) {
        ctx.globalAlpha = Math.min(1, s.life * 1.5);
        ctx.fillStyle = s.color;
        ctx.fillRect(Math.round(s.x), sy(s.y), 1, 1);
      }
      ctx.globalAlpha = 1;
    }
  }

  window.Ocean = Ocean;
  window.Ocean.MAX_DEPTH = MAX_DEPTH;
})();

// Pixel-styled SVG charts for the results screen. Single series each, so the
// chart title names it and there's no legend box; each mark carries a hover /
// focus tooltip (data-tip) and the guess list below acts as the table view.
(function () {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (parent) parent.appendChild(n);
    return n;
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function tipFor(g, tier, extra = '') {
    const said = g.timedOut || !tier ? 'Time ran out' : `“${esc(g.guess)}” → ${esc(tier.name)}`;
    return `<b>P${g.index + 1}</b> ${esc(g.prompt)}<br>${said}<br>+${g.points} pts · ↓${g.depth}m${extra}`;
  }

  /** Points per prompt: one bar per guess, 0–100 scale. */
  function bars(guesses, total, tiers) {
    const byKey = Object.fromEntries(tiers.map(t => [t.key, t]));
    const W = 320, H = 170, L = 30, R = 6, T = 18, B = 26;
    const max = 100;
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img', 'shape-rendering': 'crispEdges',
      'aria-label': 'Points per prompt: ' + guesses.map(g => `prompt ${g.index + 1}, ${g.points} points`).join('; ') });
    const y = v => T + (H - T - B) * (1 - v / max);
    for (const v of [0, 25, 50, 75, 100]) {
      el('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), class: v === 0 ? 'axis' : 'grid' }, svg);
      if (v % 50 === 0) el('text', { x: L - 6, y: y(v) + 3, 'text-anchor': 'end' }, svg).textContent = v;
    }
    const slots = Math.max(total, guesses.length, 1);
    const slotW = (W - L - R) / slots;
    const bw = Math.min(40, Math.round(slotW * 0.56));
    guesses.forEach((g, i) => {
      const t = byKey[g.tier];
      const cx = L + slotW * (i + 0.5);
      const x = Math.round(cx - bw / 2);
      const grp = el('g', { tabindex: 0, 'data-tip': tipFor(g, t) }, svg);
      el('rect', { class: 'hit', x: L + slotW * i, y: T, width: slotW, height: H - T - B }, grp);
      if (g.points > 0) {
        const top = Math.round(y(g.points));
        el('rect', { class: 'bar', x, y: top, width: bw, height: y(0) - top, fill: `var(--t-${g.tier})`, style: `animation-delay:${i * 110}ms` }, grp);
        // Pixel highlight on the left edge of each bar.
        el('rect', { class: 'bar', x, y: top, width: 4, height: y(0) - top, fill: 'rgba(255,255,255,.28)', style: `animation-delay:${i * 110}ms` }, grp);
        el('text', { x: cx, y: top - 6, 'text-anchor': 'middle', class: 'val' }, grp).textContent = g.points;
      } else {
        el('rect', { x, y: y(0) - 4, width: bw, height: 4, fill: 'var(--t-miss)' }, grp);
        el('text', { x: cx, y: y(0) - 10, 'text-anchor': 'middle', class: 'val' }, grp).textContent = '0';
      }
      el('text', { x: cx, y: H - 8, 'text-anchor': 'middle' }, grp).textContent = 'P' + (i + 1);
    });
    return svg;
  }

  /** Dive profile: cumulative depth after each prompt, drawn downward like a dive computer log. */
  function profile(guesses, total, tiers) {
    const byKey = Object.fromEntries(tiers.map(t => [t.key, t]));
    const W = 320, H = 190, L = 40, R = 14, T = 12, B = 24;
    const maxDepth = Math.max(100, total * 100);
    const steps = Math.max(total, guesses.length, 1);
    const x = i => L + (W - L - R) * (i / steps);
    const y = m => T + (H - T - B) * (m / maxDepth);
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img',
      'aria-label': 'Dive profile: ' + guesses.map((g, i) => `after prompt ${i + 1}, ${guesses.slice(0, i + 1).reduce((s, q) => s + q.depth, 0)} metres`).join('; ') });
    const defs = el('defs', {}, svg);
    const grad = el('linearGradient', { id: 'abyss', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    el('stop', { offset: '0%', 'stop-color': '#2390cc' }, grad);
    el('stop', { offset: '100%', 'stop-color': '#030818' }, grad);

    const ticks = maxDepth <= 200 ? 50 : 100;
    for (let m = 0; m <= maxDepth; m += ticks) {
      el('line', { x1: L, x2: W - R, y1: y(m), y2: y(m), class: m === 0 ? 'axis' : 'grid', 'shape-rendering': 'crispEdges' }, svg);
      el('text', { x: L - 6, y: y(m) + 3, 'text-anchor': 'end' }, svg).textContent = m + 'm';
    }
    for (let i = 1; i <= steps; i++) {
      el('text', { x: x(i), y: H - 6, 'text-anchor': 'middle' }, svg).textContent = 'P' + i;
    }

    const pts = [[x(0), y(0)]];
    let d = 0;
    guesses.forEach((g, i) => { d += g.depth; pts.push([x(i + 1), y(d)]); });
    // Area between the surface and the dive line.
    el('path', { class: 'area', d: `M${pts.map(p => p.join(',')).join(' L')} L${pts[pts.length - 1][0]},${y(0)} Z` }, svg);
    const line = el('polyline', { class: 'line', points: pts.map(p => p.join(',')).join(' ') }, svg);
    let len = 0;
    for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    line.style.setProperty('--len', Math.ceil(len));

    // The sub starts at the surface.
    el('rect', { x: x(0) - 4, y: y(0) - 4, width: 8, height: 8, fill: '#ffd23f', class: 'dot' }, svg);
    d = 0;
    guesses.forEach((g, i) => {
      d += g.depth;
      const t = byKey[g.tier];
      const grp = el('g', { tabindex: 0, 'data-tip': tipFor(g, t, `<br>Total depth ${d}m`) }, svg);
      el('rect', { class: 'hit', x: x(i + 1) - 16, y: y(d) - 16, width: 32, height: 32 }, grp);
      el('rect', { class: 'dot', x: x(i + 1) - 5, y: y(d) - 5, width: 10, height: 10,
        fill: g.tier ? `var(--t-${g.tier})` : 'var(--t-miss)', style: `animation-delay:${400 + i * 220}ms` }, grp);
      if (i === guesses.length - 1) {
        const lbl = el('text', { x: x(i + 1) - 8, y: y(d) + 20, 'text-anchor': 'end', class: 'val', style: 'animation: dot-in 300ms 1.4s both' }, grp);
        lbl.textContent = d + 'm';
      }
    });
    return svg;
  }

  window.Charts = { bars, profile };
})();

// Nichion admin: edit prompts/answers for any day, then download a new copy
// of this same HTML file with those prompts baked in (scrambled).
(function () {
  'use strict';

  const E = window.NichionEngine;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const h = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const BOOK_KEY = 'nichion_admin_book_v1';
  const SESSION_KEY = 'nichion_admin_session';
  const tiers = E.TIERS;
  const MAXP = E.MAX_PROMPTS;

  let root, DATA, PRISTINE, onExit;
  let book = null;          // { salt, admin:{salt,hash}|null, days:{date: prompts}, fileStamp, dirty, savedAt }
  let month = null, selected = null;
  let libFilter = 'past', libQuery = '';
  let draft = null, saved = '';
  const today = () => E.localDate();

  function toast(msg, kind = '') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'show ' + kind;
    clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = kind), 2600);
  }
  const fmt = (d, o = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) => new Date(d + 'T12:00:00Z').toLocaleDateString(undefined, { ...o, timeZone: 'UTC' });
  const dirty = () => draft && JSON.stringify(draft) !== saved;
  const lines = s => s.split('\n').map(x => x.trim()).filter(Boolean);
  const count = d => (book.days[d] || []).length;
  const randomId = () => Array.from(crypto.getRandomValues(new Uint8Array(9)), b => b.toString(16).padStart(2, '0')).join('');

  // ---------------------------------------------------------------- the book
  function bookFromFile() {
    const days = {};
    for (const d of Object.keys(DATA.days || {})) days[d] = E.decodeDay(DATA.salt, d, DATA.days[d]);
    return { salt: DATA.salt, admin: DATA.admin || null, days, fileStamp: DATA.stamp, dirty: false };
  }
  function storeBook() { try { localStorage.setItem(BOOK_KEY, JSON.stringify(book)); } catch {} }
  function loadStoredBook() { try { return JSON.parse(localStorage.getItem(BOOK_KEY) || 'null'); } catch { return null; } }

  async function chooseBook() {
    const stored = loadStoredBook();
    if (stored && stored.fileStamp === DATA.stamp) { book = stored; return; }
    if (stored && stored.dirty) {
      const keep = confirm(`This browser has admin edits that were never downloaded into a game file${stored.savedAt ? ` (last saved ${new Date(stored.savedAt).toLocaleString()})` : ''}.\n\nOK = keep working on those edits\nCancel = load the prompts from this file instead`);
      if (keep) { book = stored; return; }
    }
    book = bookFromFile();
    storeBook();
  }

  // -------------------------------------------------------------- download
  function buildFile() {
    const stamp = randomId();
    const days = {};
    for (const [d, prompts] of Object.entries(book.days)) if (prompts.length) days[d] = E.encodeDay(book.salt, d, prompts);
    const data = { v: 1, stamp, salt: book.salt, admin: book.admin, days };
    const json = JSON.stringify(data);
    const re = new RegExp('(<script id="nichion-' + 'data" type="application/json">)[\\s\\S]*?(</' + 'script>)');
    return { stamp, html: PRISTINE.replace(re, (_, a, b) => a + json + b) };
  }

  function download() {
    if (dirty() && !confirm('The day you are editing has unsaved changes. Download without them?')) return;
    const { stamp, html } = buildFile();
    const blob = new Blob([html], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'nichion.html';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    book.fileStamp = stamp; book.dirty = false; storeBook();
    renderTop();
    toast('Downloaded nichion.html — share that file with players');
  }

  // ------------------------------------------------------------------ login
  function renderLogin(msg = '') {
    const setup = !book.admin;
    root.innerHTML = '';
    const node = h(`<div class="login px-box">
      <div class="art"></div>
      <h1>${setup ? 'SET ADMIN PASSWORD' : 'ADMIN DOCK'}</h1>
      <p>${setup ? 'Pick a password. It gets saved into the game file you download, so only you can edit prompts.' : 'Set future prompts and answers.'}</p>
      <form>
        <label class="sr-only" for="pw">Admin password</label>
        <input class="field" id="pw" type="password" autocomplete="${setup ? 'new-password' : 'current-password'}" placeholder="Password" required>
        ${setup ? '<label class="sr-only" for="pw2">Repeat password</label><input class="field" id="pw2" type="password" autocomplete="new-password" placeholder="Repeat password" required>' : ''}
        <button class="btn wide" type="submit">${setup ? 'SET PASSWORD' : 'LOG IN'}</button>
        <button class="btn wide ghost" type="button" data-back>◂ BACK TO GAME</button>
        <p class="err" role="alert">${esc(msg)}</p>
      </form>
    </div>`);
    node.querySelector('.art').append(Sprites.img('nichion', 4));
    root.append(node);
    const input = node.querySelector('#pw');
    input.focus();
    node.querySelector('[data-back]').addEventListener('click', exit);
    node.querySelector('form').addEventListener('submit', e => {
      e.preventDefault();
      const err = node.querySelector('.err');
      if (setup) {
        const pw2 = node.querySelector('#pw2').value;
        if (input.value.length < 4) { err.textContent = 'Use at least 4 characters.'; return; }
        if (input.value !== pw2) { err.textContent = 'Passwords don’t match.'; return; }
        const salt = randomId();
        book.admin = { salt, hash: E.sha256(salt + '|' + input.value) };
        book.dirty = true; storeBook();
      } else if (E.sha256(book.admin.salt + '|' + input.value) !== book.admin.hash) {
        // Small delay to make guessing slower.
        err.textContent = '…';
        setTimeout(() => { err.textContent = 'Wrong password.'; input.select(); }, 600);
        return;
      }
      try { sessionStorage.setItem(SESSION_KEY, book.admin.hash); } catch {}
      renderShell();
    });
  }

  function loggedIn() { try { return !!book.admin && sessionStorage.getItem(SESSION_KEY) === book.admin.hash; } catch { return false; } }

  // ------------------------------------------------------------------ shell
  function renderShell() {
    root.innerHTML = '';
    const top = h('<header class="a-top"></header>');
    const grid = h(`<div class="a-grid"><div class="a-side"><aside class="cal px-box"></aside><aside class="lib px-box" aria-label="Past prompts"></aside></div><section id="editor"></section></div>`);
    root.append(top, grid);
    renderTop();
    month = today().slice(0, 7);
    let d = E.addDays(today(), 1);
    for (let i = 0; i < 60 && count(d) >= MAXP; i++) d = E.addDays(d, 1);
    selectDay(d, true);
  }

  function renderTop() {
    const top = root.querySelector('.a-top');
    if (!top) return;
    top.innerHTML = '';
    top.append(h(`<div class="a-brand"><h1>NICHION</h1><span class="badge">ADMIN</span></div>`),
      h(`<div class="a-actions">
        <button class="btn small ghost" data-exit>◂ GAME</button>
        <button class="btn small ghost" data-more>MORE ▾</button>
        <button class="btn small ${book.dirty ? '' : 'blue'}" data-dl>⬇ DOWNLOAD GAME FILE</button>
      </div>`));
    top.querySelector('.a-brand').prepend(Sprites.img('nichion', 2));
    if (book.dirty) top.append(h(`<div class="publish-note">Saved here in this browser — <b>download the game file</b> and share it so players get your changes.</div>`));
    top.querySelector('[data-exit]').addEventListener('click', exit);
    top.querySelector('[data-dl]').addEventListener('click', download);
    top.querySelector('[data-more]').addEventListener('click', moreMenu);
  }

  function moreMenu() {
    const box = h(`<div class="modal-backdrop"><div class="modal px-box" role="dialog" aria-modal="true" aria-label="More admin tools">
      <h2>ADMIN TOOLS</h2>
      <div class="title-actions">
        <button class="btn wide ghost" data-a="export">BACK UP PROMPTS (.JSON)</button>
        <label class="btn wide ghost" tabindex="0">RESTORE / IMPORT .JSON<input type="file" accept="application/json,.json" hidden></label>
        <button class="btn wide ghost" data-a="pw">CHANGE PASSWORD</button>
        <button class="btn wide ghost" data-a="reset">RESET MY OWN PLAYS (TESTING)</button>
        <button class="btn wide ghost" data-a="discard">DISCARD EDITS · RELOAD FROM FILE</button>
        <button class="btn wide ghost" data-a="logout">LOG OUT</button>
        <button class="btn wide" data-a="close">CLOSE</button>
      </div>
    </div></div>`);
    document.body.append(box);
    const close = () => box.remove();
    box.addEventListener('click', e => { if (e.target === box) close(); });
    box.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    box.querySelector('[data-a="close"]').focus();
    const file = box.querySelector('input[type=file]');
    file.parentElement.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } });
